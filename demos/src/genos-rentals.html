/* ============================================================
   "Ivory & Ink" — ink navy + champagne on ivory.

:root {

  --gold-soft: #f4ede1;
  --gold-ink: #866540;
  --primary: #12203a;
  --primary-hover: #1c3157;
  --primary-fg: #fffefc;
  --ok: #3f7a5c; --ok-bg: #eff5f1; --ok-line: #bcd4c7; --ok-btn: #3f7a5c; --ok-btn-hover: #356650;
  --warn: #7c5014; --warn-bg: #faf4e9; --warn-line: #ddc9a8; --warn-btn: #946018; --warn-btn-hover: #7c5014;

  --shadow: 0 1px 2px rgba(18,32,58,.05);
  --shadow-lift: 0 8px 16px -8px rgba(18,32,58,.12), 0 2px 8px -2px rgba(18,32,58,.05);
  --shadow-modal: 0 24px 60px -12px rgba(11,21,38,.35);
  --scrim: rgba(11,21,38,.32);
  --serif: 'Libre Caslon Text', Georgia, 'Times New Roman', serif;
  --sans: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r-sm: 6px; --r: 8px; --r-lg: 12px; --r-xl: 16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1122; --bg-sunk: #0e1830; --bg-hover: #111d38; --card: #0e1830;

    --warn: #d3ab72; --warn-bg: rgba(148,96,24,.18); --warn-line: rgba(211,171,114,.32); --warn-btn: #946018; --warn-btn-hover: #a87322;
    --danger: #d49c93; --danger-bg: rgba(162,69,60,.18); --danger-line: rgba(212,156,147,.32);
    --info: #9dabc4; --info-bg: rgba(69,89,127,.2); --info-line: rgba(157,171,196,.3);

}

  --bg: #0a1122; --bg-sunk: #0e1830; --bg-hover: #111d38; --card: #0e1830;
  --line: #24344f; --line-soft: #182742;
  --ink: #eae9e4; --text: #e1e1db; --text-2: #a5abb6; --text-3: #858c99;
  --band: #0a1122; --band-sub: rgba(255,255,255,.55);
  --side: #12203a; --side-top: #0b1526;
  --gold-soft: rgba(184,149,106,.14); --gold-ink: #d9c19d;
  --primary: #c9a97f; --primary-hover: #d9c19d; --primary-fg: #0b1526;
  --ok: #92b8a3; --ok-bg: rgba(63,122,92,.16); --ok-line: rgba(146,184,163,.32); --ok-btn: #3f7a5c; --ok-btn-hover: #4f8a6c;
  --warn: #d3ab72; --warn-bg: rgba(148,96,24,.18); --warn-line: rgba(211,171,114,.32); --warn-btn: #946018; --warn-btn-hover: #a87322;
  --danger: #d49c93; --danger-bg: rgba(162,69,60,.18); --danger-line: rgba(212,156,147,.32);
  --info: #9dabc4; --info-bg: rgba(69,89,127,.2); --info-line: rgba(157,171,196,.3);
  --navy-btn: #2b3f63; --navy-btn-hover: #45597f;
  --shadow: 0 1px 2px rgba(0,0,0,.3);
  --shadow-lift: 0 10px 20px -10px rgba(0,0,0,.5);
  --shadow-modal: 0 24px 60px -12px rgba(0,0,0,.6);
  --scrim: rgba(0,0,0,.5);

}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
h1, h2, h3, h4 { font-family: var(--serif); font-weight: 400; color: var(--ink); margin: 0; letter-spacing: 0; text-wrap: balance; }
p { margin: 0; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-3); }
.muted-2 { color: var(--text-2); }
.strong { font-weight: 700; color: var(--ink); }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--text-3); }
.serif { font-family: var(--serif); }
.nowrap { white-space: nowrap; }

/* ---------- Frame: demo bar + app ---------- */
.frame { height: 100%; display: flex; flex-direction: column; min-height: 0; }
.demo-bar {
  flex: none; display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap;
  padding: 8px 16px; background: #0b1526; color: rgba(255,255,255,.72);
  font-size: 12px; border-bottom: 1px solid rgba(255,255,255,.08);
}
.demo-tag { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
.demo-tag b { color: #c9a97f; font-weight: 800; letter-spacing: .1em; font-size: 10.5px; }
.demo-switch { display: inline-flex; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); border-radius: 999px; padding: 2px; }
.demo-switch button { border: 0; background: none; color: rgba(255,255,255,.66); padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.demo-switch button:hover { color: #fff; }
.demo-switch button[aria-pressed="true"] { background: #b8956a; color: #0b1526; }
.demo-bar .spacer { flex: 1; }
.demo-link { border: 0; background: none; color: rgba(255,255,255,.66); font-size: 12px; font-weight: 600; padding: 4px 2px; }
.demo-link:hover { color: #fff; text-decoration: underline; }

.app { flex: 1; min-height: 0; display: flex; }
.main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.main { flex: 1; overflow: auto; padding: 24px; }
.page { max-width: 1024px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; animation: fadeUp .35s cubic-bezier(.16,1,.3,1) both; }
.page.wide { max-width: 1180px; }
@keyframes fadeUp { from { opacity: .001; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- Sidebar ---------- */
.sidebar { width: 224px; flex: none; background: var(--side); display: flex; flex-direction: column; min-height: 0; border-right: 1px solid rgba(255,255,255,.08); }
.brand { background: var(--side-top); padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,.08); text-align: center; }
.brand-mark { font-family: var(--serif); color: #fff; font-size: 17px; letter-spacing: .14em; line-height: 1.1; }
.brand-mark span { color: #c9a97f; font-style: italic; letter-spacing: 0; padding: 0 3px; }
.brand-sub { margin-top: 5px; font-size: 9px; font-weight: 700; letter-spacing: .26em; color: rgba(255,255,255,.42); text-transform: uppercase; }
.nav { flex: 1; overflow-y: auto; padding: 16px 12px; display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: var(--r-lg);
  color: rgba(255,255,255,.6); font-size: 13.5px; font-weight: 500; border: 0; background: none; width: 100%; text-align: left;
  transition: background .18s, color .18s;
}
.nav-item svg { width: 19px; height: 19px; flex: none; }
.nav-item:hover { color: #fff; background: rgba(255,255,255,.05); }
.nav-item.active { background: #b8956a; color: #0b1526; font-weight: 700; }
.nav-badge { margin-left: auto; background: #0b1526; color: #fff; font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 999px; min-width: 20px; text-align: center; }
.nav-group { padding: 18px 12px 4px; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.4); }
.identity { margin: 0 12px; display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: var(--r-lg); border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.05); }
.identity .av { width: 32px; height: 32px; border-radius: 50%; background: rgba(184,149,106,.15); border: 1px solid rgba(184,149,106,.3); color: #c9a97f; display: grid; place-items: center; font-size: 12px; font-weight: 800; flex: none; }
.identity .nm { color: #fff; font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.identity .rl { color: rgba(201,169,127,.9); font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
.side-foot { padding: 14px 12px; border-top: 1px solid rgba(255,255,255,.1); margin-top: 12px; display: flex; flex-direction: column; gap: 2px; }

/* ---------- Topbar ---------- */
.topbar { flex: none; height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 24px; background: var(--card); border-bottom: 1px solid var(--line); box-shadow: var(--shadow); position: relative; z-index: 5; }
.topbar h1 { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.topbar .grow { flex: 1; }
.icon-btn { border: 0; background: none; color: var(--text-2); width: 34px; height: 34px; border-radius: var(--r-lg); display: grid; place-items: center; position: relative; flex: none; }
.icon-btn:hover { background: var(--bg-sunk); color: var(--ink); }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn .dot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; background: var(--info-bg); color: var(--info); border: 1px solid rgba(184,149,106,.3); flex: none; }
.hamburger { display: none; }
.search { position: relative; width: min(340px, 40vw); }
.search input { width: 100%; height: 36px; border: 1px solid var(--line); background: var(--bg); border-radius: var(--r-lg); padding: 0 12px 0 34px; font-size: 13px; color: var(--text); }
.search input::placeholder { color: var(--text-3); }
.search svg { position: absolute; left: 10px; top: 9px; width: 17px; height: 17px; color: var(--text-3); pointer-events: none; }
.search-pop { position: absolute; top: 42px; left: 0; right: 0; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-lift); z-index: 20; max-height: 360px; overflow-y: auto; }
.search-pop button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 9px 12px; border-bottom: 1px solid var(--line-soft); }
.search-pop button:hover, .search-pop button:focus-visible { background: var(--bg-hover); }
.search-pop .t { font-size: 13px; font-weight: 700; color: var(--ink); }
.search-pop .s { font-size: 11.5px; color: var(--text-3); }
.search-pop .none { padding: 12px; font-size: 13px; color: var(--text-3); }

/* ---------- Cards with navy band ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-xl); box-shadow: var(--shadow); overflow: hidden; transition: box-shadow .3s cubic-bezier(.16,1,.3,1), border-color .3s; }
.card:hover { box-shadow: var(--shadow-lift); border-color: rgba(184,149,106,.45); }
.band { width: 100%; background: var(--band); color: #fff; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 0; text-align: left; }
button.band { cursor: pointer; }
.band-l { min-width: 0; }
.band-t { display: flex; align-items: center; gap: 10px; min-width: 0; }
.band h3 { color: #fff; font-size: 16.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.band .count { flex: none; background: rgba(255,255,255,.92); color: #12203a; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px; line-height: 1; }
.band .caret { width: 12px; height: 12px; flex: none; color: rgba(255,255,255,.7); transition: transform .2s; }
.band[aria-expanded="false"] .caret { transform: rotate(-90deg); }
.band-sub { display: block; font-size: 12px; color: var(--band-sub); margin-top: 3px; }
.band-sub.indent { padding-left: 22px; }
.band-act { flex: none; display: flex; gap: 8px; }
.btn-band { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); color: #fff; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: var(--r); white-space: nowrap; }
.btn-band:hover { background: rgba(255,255,255,.18); }
.card-body { padding: 20px 24px; }
.plain-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-xl); box-shadow: var(--shadow); padding: 20px 24px; }

.row { display: block; padding: 12px 16px; transition: background .15s; width: 100%; text-align: left; border: 0; background: none; color: inherit; }
.rows > * + * { border-top: 1px solid var(--line-soft); }
.row.hov { cursor: pointer; }
.row.hov:hover { background: var(--bg-hover); }
.row-main { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.row-l { min-width: 0; flex: 1 1 12rem; }
.row-t { font-size: 14px; font-weight: 700; color: var(--ink); overflow: hidden; text-overflow: ellipsis; }
.row-t .sub { font-size: 12px; color: var(--text-3); font-weight: 500; }
.row-s { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.row-r { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.row-acts { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
.empty { padding: 22px 24px; font-size: 13.5px; color: var(--text-3); }
.bulkbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line-soft); background: var(--bg); font-size: 12.5px; color: var(--text-2); }

/* ---------- Chips & badges ---------- */
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid; border-radius: 999px; padding: 2px 8px; font-size: 10.5px; font-weight: 800; white-space: nowrap; line-height: 1.5; }
.chip.neutral { background: var(--bg-sunk); color: var(--text-2); border-color: var(--line); }
.chip.info { background: var(--info-bg); color: var(--info); border-color: var(--info-line); }
.chip.ok { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-line); }
.chip.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-line); }
.chip.danger { background: var(--danger-bg); color: var(--danger); border-color: var(--danger-line); }
.chip.gold { background: var(--gold-soft); color: var(--gold-ink); border-color: rgba(184,149,106,.4); }
.badge { display: inline-flex; align-items: center; border: 1px solid; border-radius: var(--r-sm); padding: 3px 9px; font-size: 10.5px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; white-space: nowrap; background: transparent; }
.badge.received { color: var(--info); border-color: var(--info-line); }
.badge.progress { color: var(--warn); border-color: var(--warn-line); }
.badge.ready { color: var(--ok); border-color: var(--ok-line); }
.badge.picked { color: var(--text-2); border-color: var(--line); }
.badge.returned { color: var(--text-3); border-color: var(--line); }
.badge.cancelled { color: var(--danger); border-color: var(--danger-line); }
.due { font-size: 12px; font-weight: 800; color: var(--danger); white-space: nowrap; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid transparent; border-radius: var(--r-lg); padding: 8px 14px; font-size: 13px; font-weight: 700; line-height: 1.3; white-space: nowrap; transition: background .15s, border-color .15s, opacity .15s; }
.btn svg { width: 16px; height: 16px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: var(--primary-fg); }
.btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
.btn-ok { background: var(--ok-btn); color: #fff; }
.btn-ok:hover:not(:disabled) { background: var(--ok-btn-hover); }
.btn-navy { background: var(--navy-btn); color: #fff; }
.btn-navy:hover:not(:disabled) { background: var(--navy-btn-hover); }
.btn-warn { background: var(--warn-btn); color: #fff; }
.btn-warn:hover:not(:disabled) { background: var(--warn-btn-hover); }
.btn-ghost { background: var(--card); color: var(--ink); border-color: var(--line); }
.btn-ghost:hover:not(:disabled) { background: var(--bg-sunk); }
.btn-danger { background: transparent; color: var(--danger); border-color: var(--danger-line); }
.btn-danger:hover:not(:disabled) { background: var(--danger-bg); }
.btn-gold { background: #b8956a; color: #0b1526; }
.btn-gold:hover:not(:disabled) { background: #c9a97f; }
.btn-sm { padding: 6px 11px; font-size: 12px; border-radius: var(--r); }
.btn-block { width: 100%; }
.linkish { border: 0; background: none; padding: 0; color: var(--gold-ink); font-weight: 700; font-size: 12.5px; }
.linkish:hover { text-decoration: underline; }

/* ---------- Flash ---------- */
.flash { border: 1px solid; border-radius: var(--r-lg); padding: 12px 16px; font-size: 13.5px; }
.flash.ok { background: var(--ok-bg); border-color: var(--ok-line); color: var(--ok); }
.flash.warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn); }
.flash.err { background: var(--danger-bg); border-color: var(--danger-line); color: var(--danger); }
.flash.info { background: var(--info-bg); border-color: var(--info-line); color: var(--info); }

/* ---------- Segmented filters & tabs ---------- */
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--card); color: var(--text); font-size: 13px; font-weight: 700; }
.seg button:hover { background: var(--bg-sunk); }
.seg button[aria-pressed="true"] { background: var(--navy-btn); border-color: var(--navy-btn); color: #fff; }
.seg .n { font-size: 11px; font-weight: 800; color: var(--text-3); font-variant-numeric: tabular-nums; }
.seg button[aria-pressed="true"] .n { color: rgba(255,255,255,.8); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs button { border: 0; background: none; padding: 10px 14px; font-size: 13.5px; font-weight: 700; color: var(--text-3); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); }
.tabs .n { margin-left: 6px; font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }

.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.toolbar .l, .toolbar .r { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.head-row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: flex-end; justify-content: space-between; }

/* ---------- Forms ---------- */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .lbl { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); }
.input, .select, .textarea { width: 100%; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: var(--r-lg); padding: 9px 12px; font-size: 14px; }
.input:focus, .select:focus, .textarea:focus { outline: 2px solid rgba(184,149,106,.45); outline-offset: 0; border-color: var(--gold); }
.textarea { resize: vertical; min-height: 120px; line-height: 1.5; font-size: 13.5px; }
.input.sm, .select.sm { padding: 7px 10px; font-size: 13px; }
.help { font-size: 12px; color: var(--text-3); }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
.search-inline { position: relative; flex: 1 1 260px; max-width: 420px; }
.search-inline .input { padding-left: 36px; }
.search-inline svg { position: absolute; left: 12px; top: 11px; width: 17px; height: 17px; color: var(--text-3); pointer-events: none; }
.check { display: flex; align-items: center; gap: 8px; font-size: 13.5px; }
.check input { width: 16px; height: 16px; accent-color: #b8956a; }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); padding: 11px 16px; border-bottom: 1px solid var(--line); background: var(--bg); white-space: nowrap; }
.tbl td { padding: 12px 16px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr.click { cursor: pointer; }
.tbl tbody tr.click:hover td { background: var(--bg-hover); }
.tbl .r { text-align: right; }
.tbl .t { font-weight: 700; color: var(--ink); }
.tbl .s { font-size: 12px; color: var(--text-3); }
.tbl tfoot td { font-weight: 800; color: var(--ink); background: var(--bg); border-top: 1px solid var(--line); }

/* ---------- Tiles ---------- */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 16px 18px; box-shadow: var(--shadow); min-width: 0; }
.tile .v { font-family: var(--serif); font-size: 27px; color: var(--ink); margin-top: 6px; font-variant-numeric: tabular-nums; line-height: 1.15; }
.tile .h { font-size: 12px; color: var(--text-3); margin-top: 4px; }
.tile .h.up { color: var(--ok); } .tile .h.down { color: var(--danger); }

/* ---------- Key/value ---------- */
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px 20px; }
.kv .k { font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
.kv .v { font-size: 14px; color: var(--ink); font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.kv .v.big { font-family: var(--serif); font-weight: 400; font-size: 20px; }

/* ---------- Status stepper ---------- */
.stepper { display: flex; }
.step { flex: 1; min-width: 0; position: relative; text-align: center; padding-top: 32px; }
.step::before { content: ''; position: absolute; top: 11px; left: -50%; right: 50%; height: 2px; background: var(--line); }
.step:first-child::before { display: none; }
.step.done::before, .step.now::before { background: var(--gold); }
.step .dotc { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); background: var(--card); display: grid; place-items: center; z-index: 1; }
.step.done .dotc { background: var(--gold); border-color: var(--gold); color: #0b1526; }
.step.now .dotc { border-color: var(--gold); box-shadow: 0 0 0 4px var(--gold-soft); }
.step.now .dotc::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); }
.step .dotc svg { width: 13px; height: 13px; }
.step .sl { font-size: 11.5px; font-weight: 700; color: var(--text-3); padding: 0 4px; line-height: 1.3; }
.step.done .sl, .step.now .sl { color: var(--ink); }
.step .sd { font-size: 11px; color: var(--text-3); margin-top: 2px; }

/* ---------- Timeline ---------- */
.tl { display: grid; grid-template-columns: 14px 1fr; gap: 12px; position: relative; padding-bottom: 14px; }
.tl::before { content: ''; position: absolute; left: 6px; top: 16px; bottom: 0; width: 2px; background: var(--line-soft); }
.tl:last-child { padding-bottom: 0; }
.tl:last-child::before { display: none; }
.tl .pt { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--gold); background: var(--card); margin-top: 3px; }
.tl .a { font-size: 13.5px; color: var(--ink); font-weight: 600; }
.tl .b { font-size: 12px; color: var(--text-3); }

/* ---------- Modal ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); backdrop-filter: blur(3px); z-index: 60; display: grid; place-items: center; padding: 16px; animation: fade .15s both; }
@keyframes fade { from { opacity: .001; } to { opacity: 1; } }
.modal { width: min(560px, 100%); max-height: calc(100% - 16px); display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-xl); box-shadow: var(--shadow-modal); overflow: hidden; animation: pop .22s cubic-bezier(.34,1.4,.64,1) both; }
.modal.lg { width: min(760px, 100%); }
@keyframes pop { from { opacity: .001; transform: scale(.97); } to { opacity: 1; transform: none; } }
.modal-head { background: var(--band); color: #fff; padding: 14px 20px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.modal-head h3 { color: #fff; font-size: 18px; }
.modal-head p { color: var(--band-sub); font-size: 12.5px; margin-top: 3px; }
.modal-head .x { border: 0; background: rgba(255,255,255,.08); color: #fff; width: 30px; height: 30px; border-radius: var(--r); display: grid; place-items: center; flex: none; }
.modal-head .x:hover { background: rgba(255,255,255,.16); }
.modal-head .x svg { width: 16px; height: 16px; }
.modal-body { padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
.modal-foot { padding: 14px 20px; border-top: 1px solid var(--line-soft); display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; background: var(--bg); }

/* ---------- Toast ---------- */
.toasts { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 80; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
.toast { pointer-events: auto; background: #12203a; color: #fff; border: 1px solid rgba(255,255,255,.12); border-left: 3px solid #b8956a; border-radius: var(--r-lg); padding: 11px 16px; font-size: 13px; box-shadow: var(--shadow-modal); max-width: min(380px, calc(100vw - 32px)); animation: pop .22s both; }
.toast small { display: block; color: rgba(255,255,255,.62); font-size: 11.5px; margin-top: 2px; }

/* ---------- Misc blocks ---------- */
.split { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
.stack-sm { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.progress { height: 6px; border-radius: 999px; background: var(--bg-sunk); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--gold); border-radius: 999px; }
.progress.ok > i { background: var(--ok-btn); }
.pill-count { font-size: 12px; font-weight: 800; white-space: nowrap; }
.pill-count.ok { color: var(--ok); } .pill-count.warn { color: var(--warn); }
.crumbs { display: flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--text-3); flex-wrap: wrap; }
.crumbs button { border: 0; background: none; padding: 0; color: var(--gold-ink); font-weight: 700; font-size: 12.5px; }
.crumbs button:hover { text-decoration: underline; }
.hero-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 24px; align-items: flex-end; }
.hero-head h2 { font-size: 28px; line-height: 1.15; }
.hero-head .meta { margin-top: 6px; font-size: 13.5px; color: var(--text-2); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.hero-head .acts { display: flex; flex-wrap: wrap; gap: 8px; }
.note { background: var(--gold-soft); border: 1px solid rgba(184,149,106,.35); color: var(--text); border-radius: var(--r-lg); padding: 12px 14px; font-size: 13px; }

/* Look (registry style) */
.looks { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
.look { border: 1px solid var(--line); border-radius: var(--r-xl); background: var(--card); overflow: hidden; min-width: 0; }
.look-head { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; border-bottom: 1px solid var(--line-soft); background: var(--bg); }
.look-head h4 { font-size: 17px; }
.look-head .who { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.swatch { width: 40px; height: 40px; border-radius: 10px; flex: none; border: 1px solid var(--line); display: block; }
.slot { display: grid; grid-template-columns: 92px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 8px 16px; font-size: 13px; border-bottom: 1px solid var(--line-soft); }
.slot:last-child { border-bottom: 0; }
.slot .k { font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
.slot .v { color: var(--ink); font-weight: 600; min-width: 0; }
.slot .v.none { color: var(--text-3); font-weight: 500; font-style: italic; }
.slot .p { color: var(--text-2); font-variant-numeric: tabular-nums; font-size: 12.5px; }
.look-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 11px 16px; background: var(--bg); border-top: 1px solid var(--line-soft); font-size: 13px; }
.cdot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(0,0,0,.18); vertical-align: -1px; margin-right: 6px; flex: none; }

/* Calendar */
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.cal-head h2 { font-size: 24px; }
.cal-wrap { overflow-x: auto; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); border: 1px solid var(--line); border-radius: var(--r-xl); overflow: hidden; background: var(--line-soft); gap: 1px; }
.cal .dow { background: var(--bg); padding: 8px 10px; font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
.cal .day { background: var(--card); min-height: 104px; padding: 6px 7px; display: flex; flex-direction: column; gap: 3px; border: 0; text-align: left; color: inherit; min-width: 0; }
.cal .day:hover { background: var(--bg-hover); }
.cal .day.out { background: var(--bg); }
.cal .day.out .dn { opacity: .5; }
.cal .day.sel { box-shadow: inset 0 0 0 2px var(--gold); }
.cal .dn { font-size: 12px; font-weight: 800; color: var(--text-2); font-variant-numeric: tabular-nums; align-self: flex-start; }
.cal .day.today .dn { background: #b8956a; color: #0b1526; border-radius: 999px; padding: 0 7px; }
.ev { font-size: 11px; font-weight: 700; border-radius: 5px; padding: 1px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 3px solid; max-width: 100%; }
.ev.wedding { background: var(--gold-soft); color: var(--gold-ink); border-color: #b8956a; }
.ev.pickup { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-btn); }
.ev.return { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-btn); }
.ev.appt { background: var(--info-bg); color: var(--info); border-color: var(--navy-btn); }
.ev.more { border: 0; background: none; color: var(--text-3); padding-left: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--text-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* Charts */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--text-3); font-family: var(--sans); font-size: 11px; }
.chart .gl { stroke: var(--line-soft); stroke-width: 1; }
.chart .base { stroke: var(--line); stroke-width: 1; }
.chart .bar { fill: var(--primary); opacity: .9; }
.chart .bar.hi { fill: #b8956a; opacity: 1; }
.chart .val { fill: var(--ink); font-weight: 700; }
.hbar { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.6fr) 48px; gap: 12px; align-items: center; font-size: 13px; padding: 7px 0; }
.hbar .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); font-weight: 600; }
.hbar .track { height: 8px; background: var(--bg-sunk); border-radius: 999px; overflow: hidden; }
.hbar .track i { display: block; height: 100%; background: #b8956a; border-radius: 999px; }
.hbar .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-2); font-weight: 700; }

/* SMS */
.phone { width: 100%; max-width: 300px; border-radius: 28px; border: 1px solid var(--line); background: var(--bg); padding: 16px 14px 18px; margin: 0 auto; }
.phone .who { text-align: center; font-size: 11px; color: var(--text-3); margin-bottom: 12px; }
.bubble { background: var(--bg-sunk); color: var(--ink); border-radius: 18px 18px 18px 5px; padding: 10px 13px; font-size: 13.5px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
.seg-meter { font-size: 12px; color: var(--text-3); display: flex; gap: 12px; flex-wrap: wrap; }
.parse-list { max-height: 280px; overflow-y: auto; border: 1px solid var(--line); border-radius: var(--r-lg); }
.parse-list .pr { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 12px; font-size: 13px; border-bottom: 1px solid var(--line-soft); }
.parse-list .pr:last-child { border-bottom: 0; }

/* ---------- Customer portal ---------- */
.welcome { background: var(--band); color: #fff; border-radius: var(--r-xl); padding: 26px 28px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 18px 28px; align-items: center; position: relative; overflow: hidden; }
.welcome::after { content: ''; position: absolute; right: -70px; top: -70px; width: 240px; height: 240px; border-radius: 50%; border: 1px solid rgba(201,169,127,.25); box-shadow: 0 0 0 26px rgba(201,169,127,.05), 0 0 0 60px rgba(201,169,127,.035); pointer-events: none; }
.welcome .eyebrow { color: #c9a97f; }
.welcome h2 { color: #fff; font-size: 26px; margin-top: 6px; }
.welcome p { color: rgba(255,255,255,.66); margin-top: 6px; font-size: 14px; }
.countdown { display: flex; gap: 10px; position: relative; z-index: 1; }
.countdown div { text-align: center; min-width: 64px; padding: 10px 10px 8px; border: 1px solid rgba(255,255,255,.14); border-radius: var(--r-lg); background: rgba(255,255,255,.04); }
.countdown b { display: block; font-family: var(--serif); font-weight: 400; font-size: 28px; color: #c9a97f; line-height: 1.1; font-variant-numeric: tabular-nums; }
.countdown span { font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.55); }
.paybox { display: flex; flex-direction: column; gap: 12px; }
.money-row { display: flex; justify-content: space-between; gap: 12px; font-size: 13.5px; }
.money-row.total { font-weight: 800; color: var(--ink); border-top: 1px solid var(--line-soft); padding-top: 10px; }
.card-field { border: 1px solid var(--line); border-radius: var(--r-lg); padding: 10px 12px; font-size: 14px; color: var(--text-2); display: flex; justify-content: space-between; gap: 10px; background: var(--card); font-variant-numeric: tabular-nums; }

/* ---------- Bride View (public page) ---------- */
.bv { min-height: 100%; background: var(--bg); }
.bv-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; background: #0b1526; border-bottom: 1px solid rgba(255,255,255,.08); }
.bv-top .brand-mark { font-size: 15px; }
.bv-top .tag { font-size: 11px; color: rgba(255,255,255,.55); font-weight: 600; }
.bv-hero { background: #12203a; color: #fff; text-align: center; padding: 44px 16px 40px; position: relative; overflow: hidden; }
.bv-hero::before, .bv-hero::after { content: ''; position: absolute; width: 420px; height: 420px; border-radius: 50%; border: 1px solid rgba(201,169,127,.18); top: 50%; transform: translateY(-50%); pointer-events: none; }
.bv-hero::before { left: -260px; } .bv-hero::after { right: -260px; }
.bv-hero .eyebrow { color: #c9a97f; }
.bv-hero h1 { color: #fff; font-size: clamp(32px, 6vw, 52px); margin-top: 12px; line-height: 1.1; }
.bv-hero h1 em { color: #c9a97f; font-style: italic; padding: 0 .12em; }
.bv-hero .when { margin-top: 12px; color: rgba(255,255,255,.72); font-size: 15px; }
.bv-hero .countdown { justify-content: center; margin-top: 24px; }
.bv-body { max-width: 880px; margin: 0 auto; padding: 32px 16px 56px; display: flex; flex-direction: column; gap: 24px; }
.bv-summary { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
.member-steps { display: flex; gap: 6px; flex-wrap: wrap; }
.mstep { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--text-3); background: var(--card); white-space: nowrap; }
.mstep.on { color: var(--ok); border-color: var(--ok-line); background: var(--ok-bg); }
.mstep svg { width: 12px; height: 12px; }
.faq details { border-bottom: 1px solid var(--line-soft); }
.faq details:last-child { border-bottom: 0; }
.faq summary { cursor: pointer; padding: 14px 20px; font-weight: 700; color: var(--ink); list-style: none; display: flex; justify-content: space-between; gap: 12px; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: '+'; color: #b8956a; font-size: 18px; line-height: 1; }
.faq details[open] summary::after { content: '\2013'; }
.faq .a { padding: 0 20px 16px; color: var(--text-2); font-size: 13.5px; max-width: 65ch; }
.bv-foot { text-align: center; font-size: 12px; color: var(--text-3); padding-top: 8px; }

/* ---------- Responsive ---------- */
@media (max-width: 1080px) {
  .tiles { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .split { grid-template-columns: minmax(0,1fr); }
}
@media (max-width: 1024px) {
  .sidebar { position: fixed; top: 0; bottom: 0; left: 0; z-index: 70; transform: translateX(-100%); transition: transform .25s cubic-bezier(.16,1,.3,1); box-shadow: var(--shadow-modal); padding-top: env(safe-area-inset-top, 0px); }
  .sidebar.open { transform: none; }
  .side-scrim { position: fixed; inset: 0; z-index: 65; background: var(--scrim); backdrop-filter: blur(2px); }
  .hamburger { display: grid; }
  .topbar { padding: 0 12px 0 8px; gap: 8px; }
  .main { padding: 16px; }
}
@media (max-width: 720px) {
  .search { display: none; }
  .grid-2, .grid-3, .bv-summary { grid-template-columns: minmax(0,1fr); }
  .cal .day { min-height: 60px; padding: 5px; }
  .cal .dow { padding: 6px 4px; text-align: center; }
  .cal .ev { font-size: 0; padding: 0; height: 5px; border-left-width: 0; border-radius: 3px; }
  .cal .ev.more { display: none; }
  .hero-head h2 { font-size: 23px; }
  .welcome { padding: 22px 20px; }
  .welcome h2 { font-size: 22px; }
  .countdown div { min-width: 54px; }
  .countdown b { font-size: 23px; }
  .step .sl { font-size: 10px; }
  .step .sd { display: none; }
  .demo-tag .long { display: none; }
  .slot { grid-template-columns: 76px minmax(0,1fr) auto; padding: 8px 12px; }
  .hbar { grid-template-columns: minmax(0,1fr) minmax(0,1fr) 40px; }
}
@media (max-width: 480px) {
  .tiles { gap: 10px; }
  .tile { padding: 12px 14px; }
  .tile .v { font-size: 22px; }
  .card-body { padding: 16px; }
  .band { padding: 12px 16px; }
  .plain-card { padding: 16px; }
  .demo-switch button { padding: 5px 9px; font-size: 11.5px; }
}
/* ---------- Component extras ---------- */
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
.textarea.mono { font-size: 12.5px; }
.band-btn { border: 0; background: none; color: inherit; padding: 0; text-align: left; min-width: 0; flex: 1 1 auto; cursor: pointer; }
.caret.closed { transform: rotate(-90deg); }
.linkrow { border: 0; background: none; padding: 0; text-align: left; color: inherit; cursor: pointer; }
.linkrow:hover .row-t { text-decoration: underline; text-decoration-color: rgba(184,149,106,.7); text-underline-offset: 3px; }
.card-btn { width: 100%; text-align: left; cursor: pointer; color: inherit; transition: border-color .2s, box-shadow .2s; }
.card-btn:hover, .link-card:hover { border-color: rgba(184,149,106,.55); box-shadow: var(--shadow-lift); }
.link-card { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; text-align: left; cursor: pointer; color: inherit; width: 100%; padding: 16px 18px; }
.link-card svg { width: 22px; height: 22px; color: #b8956a; margin-bottom: 4px; }
.link-card b { color: var(--ink); font-size: 14px; }
.link-card span { font-size: 12px; color: var(--text-3); }
.tbl tr.grp td { background: var(--bg-sunk); padding: 0; border-bottom: 1px solid var(--line); }
.tbl tr.grp button { width: 100%; display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 9px 16px; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); text-align: left; }
.tbl tr.grp .caret { width: 11px; height: 11px; color: var(--text-3); transition: transform .2s; }

/* ---------- money helpers (shared with seed) ---------- */
function orderTotals(o) {
  const subtotal = o.items.reduce((s, it) => s + it.price * (it.qty || 1), 0);
  const discount = +(subtotal * (o.discountPct || 0) / 100).toFixed(2);
  const tax = +((subtotal - discount) * STORE.taxRate).toFixed(2);
  const total = +(subtotal - discount + tax + (o.waiver || 0)).toFixed(2);
  const paid = +o.payments.reduce((s, p) => s + (p.type === 'refund' ? -p.amount : p.amount), 0).toFixed(2);
  const balance = +(total - paid).toFixed(2);
  return { subtotal, discount, tax, total, paid, balance };
}

    short: { weekday: 'short', month: 'short', day: 'numeric' },

function timeAgo(ts) {
  const mins = Math.round((Date.now() - new Date(ts).getTime()) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins} min ago`;
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return `${hrs} hr${hrs === 1 ? '' : 's'} ago`;
  const days = Math.round(hrs / 24);
  return `${days} day${days === 1 ? '' : 's'} ago`;
}

function calcRentalDates(eventIso) {
  const ev = parseD(eventIso);
  const pick = new Date(ev); pick.setDate(pick.getDate() - 4);
  const tomorrow = parseD(D(1));
  const pickup = pick < tomorrow ? tomorrow : pick;
  const ret = new Date(ev); const add = (8 - ev.getDay()) % 7 || 7; ret.setDate(ret.getDate() + add);
  return { pickup: isoDate(pickup), ret: isoDate(ret) };
}

function needsAttention() {
  const flags = [];
  S.weddings.filter(w => (w.status === 'approved' || w.status === 'pending') && daysUntil(w.date) >= 0 && daysUntil(w.date) <= 30)
    .sort((a, b) => a.date.localeCompare(b.date))
    .forEach(w => {
      const days = daysUntil(w.date);
      if (w.status === 'pending') { flags.push({ w, days, text: 'Registration still pending approval' }); return; }
      const total = w.members.length;
      const missing = w.members.filter(m => !m.measured).length;
      const noOrder = w.members.filter(m => m.measured && !m.orderId).length;
      if (missing) flags.push({ w, days, text: `${missing} of ${total} member${total === 1 ? '' : 's'} missing sizes` });
      if (noOrder) flags.push({ w, days, text: `${noOrder} of ${total} member${total === 1 ? '' : 's'} without an order` });
    });
  return flags;
}

function parsePartyList(text) {
  const out = []; const skipped = [];
  text.split(/\r?\n/).forEach((raw, i) => {
    const line = raw.trim(); if (!line) return;
    const email = (line.match(/[\w.+-]+@[\w-]+\.[\w.]+/) || [''])[0];
    const phoneM = line.replace(email, '').match(/(\+?1[\s.-]?)?\(?\d{3}\)?[\s.-]?\d{3}[\s.-]?\d{4}/);
    let phone = '';
    if (phoneM) { const dg = phoneM[0].replace(/\D/g, '').slice(-10); phone = `(${dg.slice(0, 3)}) ${dg.slice(3, 6)}-${dg.slice(6)}`; }
    const roleM = line.match(/\b(best man|groomsman|usher|ring bearer|father of (the )?(bride|groom))\b/i);
    let rest = line.replace(email, '').replace(phoneM ? phoneM[0] : '', '').replace(roleM ? roleM[0] : '', '').replace(/[,\t;|•-]+/g, ' ').replace(/\s+/g, ' ').trim();
    const parts = rest.split(' ').filter(Boolean).map(p => p[0].toUpperCase() + p.slice(1).toLowerCase());
    if (!parts.length) { skipped.push(`line ${i + 1}: no name found`); return; }
    const roleTxt = roleM ? roleM[0].toLowerCase() : '';
    const role = ROLES.find(r => r.toLowerCase() === roleTxt.replace('father of the', 'father of')) || 'Groomsman';
    out.push({ id: 'z' + Math.random().toString(36).slice(2, 8), first: parts[0], last: parts.slice(1).join(' '), email, phone, role });
  });
  return { out, skipped };
}

function isGsm(text) { return /^[A-Za-z0-9 \r\n@£$¥èéùìòÇØøÅåΔ_ΦΓΛΩΠΨΣΘΞÆæßÉ!"#¤%&'()*+,\-./:;<=>?¡ÄÖÑÜ§¿äöñüà^{}\\[~\]|€]*$/.test(text); }
function segments(text) {
  const gsm = isGsm(text); const len = [...text].length;
  const single = gsm ? 160 : 70; const multi = gsm ? 153 : 67;
  return { len, gsm, segs: len <= single ? 1 : Math.ceil(len / multi) };
}
function freshBulk() {
  const opted = S.customers.find(c => c.optedOut && c.phone);

  };
}
function parseBulk(text) {
  const recips = []; const skipped = []; const seen = new Set(); let dupes = 0;
  text.split(/\r?\n/).forEach((raw, i) => {
    const line = raw.trim(); if (!line) return;
    const m = line.match(/(\+?1[\s.-]?)?\(?\d{3}\)?[\s.-]?\d{3}[\s.-]?\d{4}/);
    if (!m) { skipped.push({ line: i + 1, text: line, why: /\d/.test(line) ? 'no 10-digit phone number (looks like a date or partial number)' : 'no phone number on this line' }); return; }
    const dg = m[0].replace(/\D/g, '').slice(-10);
    if (seen.has(dg)) { dupes++; return; }
    seen.add(dg);
    const name = line.replace(m[0], '').replace(/[,\t;|]+/g, ' ').replace(/\s+/g, ' ').trim();
    recips.push({ name, phone: `(${dg.slice(0, 3)}) ${dg.slice(3, 6)}-${dg.slice(6)}`, status: 'ready' });
  });

}

  const list = S.orders.filter(o => o.status !== 'Cancelled' && T(o).balance > 0.005).sort((a, b) => a.eventDate.localeCompare(b.eventDate));
  const total = list.reduce((s, o) => s + T(o).balance, 0);
  const soon = list.filter(o => daysUntil(o.eventDate) <= 7);
  return {
    title: 'Accounts', wide: true, html: `
    <div class="tiles" style="grid-template-columns:repeat(3,minmax(0,1fr))">
      <div class="tile"><p class="eyebrow">Outstanding</p><p class="v" style="color:var(--danger)">${money(total)}</p><p class="h">across ${plural(list.length, 'order')}</p></div>
      <div class="tile"><p class="eyebrow">Event within 7 days</p><p class="v">${soon.length}</p><p class="h">${money0(soon.reduce((s, o) => s + T(o).balance, 0))} to collect at pickup</p></div>
      <div class="tile"><p class="eyebrow">Paid online this month</p><p class="v">${money0(S.orders.flatMap(o => o.payments).filter(p => p.by === 'online checkout' && daysUntil(localDay(p.at)) > -30).reduce((s, p) => s + p.amount, 0))}</p><p class="h">through order links</p></div></div>
    ${card({ key: 'acc', title: 'Balances Due', count: list.length, sub: 'Every order still carrying a balance, soonest event first', body: `<div class="table-wrap"><table class="tbl"><thead><tr><th>Customer</th><th>Order</th><th>Event</th><th class="r">Total</th><th class="r">Paid</th><th class="r">Balance</th></tr></thead><tbody>
      ${list.map(o => { const t = T(o); return `<tr class="click" tabindex="0" data-a="go" data-to="/admin/orders/${o.id}"><td class="t">${esc(cname(cust(o.customerId)))}<div class="s" style="font-weight:500">${esc(o.group || o.eventType)}</div></td><td class="num">#${o.no}</td><td class="num nowrap">${fmtDate(o.eventDate, 'med')}${daysUntil(o.eventDate) <= 7 && daysUntil(o.eventDate) >= 0 ? ' <span class="chip info">SOON</span>' : ''}</td><td class="r num">${money(t.total)}</td><td class="r num" style="color:var(--ok)">${money(t.paid)}</td><td class="r num strong" style="color:var(--danger)">${money(t.balance)}</td></tr>`; }).join('')}</tbody></table></div>` })}`,
  };
}

/* ---------- Payment Log ---------- */
function pagePayments() {
  const all = S.orders.flatMap(o => o.payments.map(p => ({ ...p, o }))).sort((a, b) => b.at.localeCompare(a.at));
  const list = all.filter(p => U.pay.method === 'all' || p.method === U.pay.method);
  const used = [...new Set(all.map(p => p.method))];
  const net = list.reduce((s, p) => s + (p.type === 'refund' ? -p.amount : p.amount), 0);
  return {
    title: 'Payment Log', wide: true, html: `
    <div class="seg">${[['all', 'All methods'], ...used.map(k => [k, PAY_METHODS[k]])].map(([k, l]) => `<button type="button" data-a="payMethod" data-v="${k}" aria-pressed="${U.pay.method === k}">${esc(l)}<span class="n">${k === 'all' ? all.length : all.filter(p => p.method === k).length}</span></button>`).join('')}</div>
    ${card({ key: 'pl', title: 'Payments', count: list.length, sub: `Net ${money(net)} in the list below`, body: `<div class="table-wrap"><table class="tbl"><thead><tr><th>When</th><th>Customer</th><th>Order</th><th>Method</th><th>Type</th><th class="r">Amount</th><th>Taken by</th></tr></thead><tbody>
      ${list.slice(0, 80).map(p => `<tr class="click" tabindex="0" data-a="go" data-to="/admin/orders/${p.o.id}"><td class="num nowrap">${fmtDT(p.at)}</td><td class="t">${esc(cname(cust(p.customerId)))}</td><td class="num">#${p.o.no}</td><td>${PAY_METHODS[p.method]}${p.ref ? `<div class="s">${esc(p.ref)}</div>` : ''}</td><td><span class="chip ${p.type === 'refund' ? 'warn' : p.type === 'deposit' ? 'info' : 'neutral'}">${PAY_TYPES[p.type]}</span></td><td class="r num strong" ${p.type === 'refund' ? 'style="color:var(--warn)"' : ''}>${p.type === 'refund' ? '-' : ''}${money(p.amount)}</td><td class="nowrap">${esc(p.by.includes('@') ? staffName(p.by) : p.by)}</td></tr>`).join('')}</tbody></table></div>` })}`,

}

const me = () => cust(S.portalCustomerId);
const myOrders = () => S.orders.filter(o => o.customerId === S.portalCustomerId).sort((a, b) => b.eventDate.localeCompare(a.eventDate));
const myWedding = () => S.weddings.find(w => w.members.some(m => m.customerId === S.portalCustomerId && m.role === 'Groom'));
const JOURNEY = ['Received', 'Fitting', 'Ready', 'Picked Up'];
const journeyIdx = s => ({ 'Received': 0, 'In Progress': 1, 'Ready for Pickup': 2, 'Picked Up': 3, 'Returned': 4 }[normStatus(s)] ?? 0);
const FRIENDLY = { 'Received': ['info', 'Order Received'], 'In Progress': ['warn', 'In Fitting'], 'Ready for Pickup': ['ok', 'Ready for Pickup'], 'Picked Up': ['info', 'Picked Up'], 'Returned': ['neutral', 'Returned'], 'Cancelled': ['danger', 'Cancelled'] };
const friendly = s => { const [t, l] = FRIENDLY[normStatus(s)] || ['neutral', s]; return `<span class="chip ${t}">${l}</span>`; };
function countdown(dateIso, hour = 16) {
  const t = parseD(dateIso); t.setHours(hour, 0, 0, 0);
  const ms = Math.max(0, t.getTime() - Date.now());
  const d = Math.floor(ms / 86400000), h = Math.floor(ms % 86400000 / 3600000), m = Math.floor(ms % 3600000 / 60000);
  return `<div class="countdown" aria-label="${d} days, ${h} hours to go"><div><b>${d}</b><span>Days</span></div><div><b>${h}</b><span>Hours</span></div><div><b>${m}</b><span>Min</span></div></div>`;
}

/* ---------- Shared checkout (card form, test card prefilled) ---------- */
function checkout({ amount, title, sub, onPaid, name }) {
  openModal({
    data: { phase: 'form', name: name || cname(me()) },
    view: () => {
      const m = M.data;
      if (m.phase === 'processing') return { title: 'Processing payment', sub, body: `<div style="text-align:center;padding:24px 0"><div class="spinner" aria-hidden="true"></div><p class="muted-2" style="margin-top:14px">Confirming ${money(amount)} with the card network…</p></div>` };
      return {
        title: title || 'Secure checkout', sub,
        body: `<div class="money-row total" style="border:0;padding:0;font-size:15px"><span>Amount</span><span class="num serif" style="font-size:24px;font-weight:400">${money(amount)}</span></div>
          ${field('Card number', `<div class="card-field"><span>4242 4242 4242 4242</span><span class="mono" style="font-size:11px;letter-spacing:.08em">VISA</span></div>`)}
          <div class="grid-2">${field('Expiry', '<div class="card-field"><span>12 / 29</span></div>')}${field('CVC', '<div class="card-field"><span>123</span></div>')}</div>
          ${field('Name on card', `<input class="input" id="co-name" value="${esc(m.name)}" data-in="coName">`)}
          <p class="help" style="display:flex;gap:6px;align-items:center">${ic('lock', 'lock-ic')} Secure checkout by Stripe · Demo mode: a test card, nothing is charged.</p>`,
        foot: `<button class="btn btn-ghost" data-a="closeModal">Cancel</button><button class="btn btn-gold" data-a="coPay">Pay ${money(amount)}</button>`,
      };
    },
    onPaid,
  });
}
IN.coName = v => { M.data.name = v; };
A.coPay = () => {
  M.data.phase = 'processing'; renderModal();
  const cb = M.onPaid;
  setTimeout(() => { closeModal(); cb(); }, 1100);
};
function recordOnlinePayment(o, amount, type) {
  const c = cust(o.customerId);
  o.payments.push({ id: 'p' + Date.now(), orderId: o.id, customerId: c.id, amount: +amount.toFixed(2), type, method: 'credit_card', status: 'completed', ref: 'ch_' + Math.random().toString(36).slice(2, 10), at: NOW_ISO(), by: 'online checkout' });
  sendMessage('payment_receipt', c, o, `Thank you, ${c.first}. We received your card payment of ${money(amount)} for order #${o.no}.`, { sms: null });
  if (c.id === S.portalCustomerId) S.notifications.unshift({ id: 'n' + Date.now(), title: 'Payment received', text: `We received your card payment of ${money(amount)} for order #${o.no}. Thank you!`, at: NOW_ISO(), read: false });
}

/* ---------- Public: fitting link (self-service sizes) ---------- */
function memberById(id) { for (const w of S.weddings) { const m = w.members.find(x => x.id === id); if (m) return { w, m }; } return {}; }
function fitState(m) {
  U.fit[m.id] = U.fit[m.id] || { sizes: { coat: '42L', shoe: '11', neck: '16', sleeve: '34/35' }, meas: { Height: `6'1"`, Weight: '185' }, paid: 0, submitted: false };
  return U.fit[m.id];
}
function pageFit(id) {
  const { w, m } = memberById(id);
  if (!w || w.status !== 'approved') return { title: 'Link not found', html: '<div class="bv-body"><div class="plain-card"><h3>Link not found</h3><p class="muted-2" style="margin-top:6px">This link is invalid or has expired.</p></div></div>' };
  const f = fitState(m); const look = lookOf(w, m.lookId);
  const o = m.orderId && orderById(m.orderId);
  const pending = S.reviews.find(r => r.memberId === m.id);
  const confirmed = m.measured && !pending;
  const items = Object.values(look.items).map(code => INV[code]);
  const need = items.filter(i => SIZE_FIELDS[i.type]).map(i => [i, SIZE_FIELDS[i.type].filter(([k]) => !f.sizes[k])]).filter(([, miss]) => miss.length);
  const price = lookPrice(look.items); const tax = +(price * STORE.taxRate).toFixed(2);
  const total = o ? T(o).total : price + tax + STORE.waiver;
  const paid = o ? T(o).paid : f.paid;
  const bal = +(total - paid).toFixed(2);
  const depositLeft = Math.max(0, STORE.deposit - paid);
  return {
    title: `${m.first}'s Fitting`, html: `
    <div class="bv">
      <div class="bv-top"><div class="brand-mark">ASHFORD<span>&amp;</span>VALE</div><span class="tag">Your fitting link · no login needed</span></div>
      <section class="bv-hero" style="padding:32px 16px 30px"><p class="eyebrow">Your fitting</p><h1 style="font-size:clamp(30px,5vw,42px)">Hi, ${esc(m.first)}</h1>
        <p class="when">${esc(w.name)} · ${esc(m.role)}</p><p class="when" style="margin-top:4px">${fmtDate(w.date, 'long')} · ${esc(w.venue)}</p></section>
      <div class="bv-body" style="max-width:720px">
        ${f.justPaid ? '<div class="flash ok">Payment received, thank you!</div>' : ''}
        ${confirmed ? `<div class="flash ok">Your sizes have been confirmed by ${esc(STORE.name)}.${o ? ` Your order is #${o.no}.` : ''}</div>`
          : pending ? '<div class="flash warn"><b>Sizes submitted, awaiting confirmation.</b> A staff member will confirm these against your fitting sheet. You can still make changes and resubmit below if needed.</div>' : ''}
        <section class="card"><div class="band"><div class="band-l"><span class="band-t"><h3>Your Look</h3></span><span class="band-sub">Styles are set by the wedding party. Enter every size marked *. All of them are required.</span></div>${lookGlyph(look.items, 36)}</div>

            ${SIZE_FIELDS[i.type] ? `<div class="grid-2">${SIZE_FIELDS[i.type].map(([k, label]) => `<div class="field"><label for="fz-${k}">${esc(label)} <span style="color:var(--danger)">*</span></label><select class="select sm${f.sizes[k] ? '' : ' warn-border'}" id="fz-${k}" data-ch="fitSize" data-k="${k}" ${confirmed ? 'disabled' : ''}>${opt('', 'Choose…', f.sizes[k] || '')}${SIZES[k].map(v => opt(v, v, f.sizes[k] || '')).join('')}</select></div>`).join('')}</div>` : '<p class="help">No sizing needed for this item.</p>'}</div></div>`).join('')}</div></section>
        ${card({ key: 'fzm', title: 'Fitting Measurements', sub: 'If you know your measurements, fill in as many as you can.', flush: false, body: `<div class="grid-3">${['Chest', 'Overarm', 'Waist', 'Hip', 'Height', 'Weight'].map(k => field(k, `<input class="input sm" id="fm-${k}" data-in="fitMeas" data-k="${k}" value="${esc(f.meas[k] || '')}" ${confirmed ? 'disabled' : ''} placeholder="${k === 'Height' ? `5'10"` : k === 'Weight' ? 'lb' : 'inches'}">`)).join('')}</div>` })}
        <section class="plain-card paybox">
          ${paid < STORE.deposit ? `<div class="flash warn" style="font-size:13px">A ${money(STORE.deposit)} deposit is required before we can confirm your sizes and reserve your garments.${paid > 0 ? ` You still owe ${money(depositLeft)} of it.` : ''}</div>` : ''}
          <div class="money-row"><span class="muted-2">${esc(look.name.split(' · ')[0])} · ${items.length} pieces + 6% tax + damage waiver</span><span class="num">${money(total)}</span></div>
          ${paid ? `<div class="money-row"><span class="muted-2">Paid</span><span class="num" style="color:var(--ok);font-weight:700">${money(paid)}</span></div>` : ''}
          <div class="money-row total"><span>Balance Due</span><span class="num">${money(Math.max(0, bal))}</span></div>
          ${bal > 0.005 ? `<div class="grid-2">${depositLeft > 0 ? `<button class="btn btn-gold" data-a="fitPay" data-id="${m.id}" data-amt="${depositLeft}">Pay ${money(depositLeft)} deposit with Card</button>` : ''}<button class="btn ${depositLeft > 0 ? 'btn-ghost' : 'btn-gold'}" data-a="fitPay" data-id="${m.id}" data-amt="${bal}">Pay full balance ${money(bal)} with Card</button></div>
            <p class="help" style="text-align:center">Secure checkout by Stripe · You can also pay in store or by phone</p>` : '<div class="flash ok">This order is fully paid.</div>'}
        </section>
        ${confirmed ? '' : `${need.length ? `<div class="flash warn" style="font-size:13px">Still needed: ${need.map(([i, miss]) => `${SLOT_LABEL[i.type]} (${miss.map(x => x[1]).join(', ')})`).join('; ')}</div>` : ''}
          <button class="btn btn-primary btn-block" style="padding:12px" data-a="fitSubmit" data-id="${m.id}">${pending ? 'Resubmit Sizes' : 'Submit Sizes'}</button>`}

CH.fitSize = (v, el) => { const { m } = memberById(currentPath().split('/')[2]); fitState(m).sizes[el.dataset.k] = v; render(); };
IN.fitMeas = (v, el) => { const { m } = memberById(currentPath().split('/')[2]); fitState(m).meas[el.dataset.k] = v; };
Object.assign(A, {
  fitPay: d => {
    const { w, m } = memberById(d.id); const amt = Number(d.amt); const f = fitState(m);
    const o = m.orderId && orderById(m.orderId);
    checkout({
      amount: amt, title: amt <= STORE.deposit ? 'Pay your deposit' : 'Pay your balance', sub: `${w.name} · ${m.first} ${m.last}`, name: `${m.first} ${m.last}`,
      onPaid: () => {
        if (o) recordOnlinePayment(o, amt, amt <= STORE.deposit ? 'deposit' : 'full');
        else { f.paid = +(f.paid + amt).toFixed(2); const r = S.reviews.find(x => x.memberId === m.id); if (r) r.paid = f.paid; }
        f.justPaid = true; setTimeout(() => { f.justPaid = false; }, 8000);
        render();
      },
    });
  },
  fitSubmit: d => {
    const { w, m } = memberById(d.id); const f = fitState(m); const look = lookOf(w, m.lookId);
    const items = Object.values(look.items).map(code => INV[code]);
    const missing = items.filter(i => SIZE_FIELDS[i.type] && SIZE_FIELDS[i.type].some(([k]) => !f.sizes[k]));
    if (missing.length) { toast('A few sizes are still missing.', `Fill in: ${missing.map(i => SLOT_LABEL[i.type]).join(', ')}`); return; }
    const label = { coat: 'Coat', waist: 'Waist', outseam: 'Outseam', neck: 'Neck', sleeve: 'Sleeve', vest: 'Vest', shoe: 'Shoe' };
    const sizes = items.filter(i => SIZE_FIELDS[i.type]).map(i => [i.type, i.code, i.desc, SIZE_FIELDS[i.type].map(([k]) => `${label[k]}: ${f.sizes[k]}`).join(' · ')]);
    const meas = Object.fromEntries(Object.entries(f.meas).filter(([, v]) => v));
    S.reviews = S.reviews.filter(r => r.memberId !== m.id);
    S.reviews.push({ id: 'rv' + Date.now(), kind: 'sizes', wedding: w.name, memberId: m.id, name: `${m.first} ${m.last}`, role: m.role, email: m.email, orderNo: m.orderId ? orderById(m.orderId).no : null, submittedAt: NOW_ISO(), sizes, meas, paid: f.paid });
    f.submitted = true;
    toast('Sizes sent to the store.', 'Switch to “Staff app” → Orders → Pending Review to approve them.'); render();
  },
});

/* ============================================================
   ROUTES
   ============================================================ */
function resolvePage(p) {
  const seg = p.split('/').filter(Boolean);
  const rest = decodeURIComponent(seg.slice(2).join('/'));
  if (seg[0] === 'portal') {
    return ({ dashboard: pagePortalDash, orders: () => seg[2] ? pagePortalOrder(seg[2]) : pagePortalOrders(), measurements: pagePortalMeas, notifications: pagePortalNotes, wedding: pagePortalWedding, profile: pagePortalProfile }[seg[1]] || pagePortalDash)();
  }
  if (seg[0] === 'bride') return pageBride(decodeURIComponent(seg.slice(1).join('/')));
  if (seg[0] === 'fit') return pageFit(seg[1]);
  switch (seg[1]) {
    case 'calendar': return pageCalendar();
    case 'orders': return seg[2] ? pageOrder(seg[2]) : pageOrders();
    case 'groups': return seg[2] === 'new' ? pageWizard() : seg[2] ? pageGroup(rest) : pageGroups();
    case 'customers': return seg[2] ? pageCustomer(seg[2]) : pageCustomers();
    case 'appointments': return pageAppointments();
    case 'messages': return pageMessages();
    case 'accounts': return pageAccounts();
    case 'payments': return pagePayments();
    case 'reports': return pageReports();
    case 'users': return pageUsers();
    case 'broadcast': return pageBulk();
    case 'close': return pageClose();
    default: return pageToday();
  }
}

/* ---------- boot ---------- */
render();
setInterval(() => {
  const p = currentPath();
  if (!M && (p.startsWith('/bride') || p === '/portal/dashboard')) render();
}, 30000);
