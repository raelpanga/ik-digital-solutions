<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>IK hero device motion source</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #e5e8e4; }
  canvas { display: block; width: 1120px; height: 980px; }
</style>
<canvas id="stage" width="1120" height="980" aria-label="Animated portfolio device composition"></canvas>
<script>
"use strict";
const canvas = document.querySelector("#stage"), ctx = canvas.getContext("2d", { alpha: false });
const W = canvas.width, H = canvas.height, DURATION = 8;
const sources = {
  desktop: "/shots/fieldstone-construction-desktop.png",
  desktopAlt: "/shots/kimia-express-desktop.png",
  mobile: "/shots/ndala-beauty-mobile.png",
  mobileAlt: "/shots/fieldstone-construction-mobile.png",
  tablet: "/shots/kando-ressources-desktop.png",
  tabletAlt: "/shots/site-corporate-desktop.png"
};
const images = {};
window.sceneReady = Promise.all(Object.entries(sources).map(([key, src]) => new Promise((resolve, reject) => {
  const image = new Image();
  image.onload = () => { images[key] = image; resolve(); };
  image.onerror = () => reject(new Error("Image failed to load: " + src));
  image.src = src;
})));
const phase = t => Math.PI * 2 * t / DURATION;
function rounded(x, y, w, h, r, fill) {
  ctx.fillStyle = fill;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill();
}
function line(x1, y1, x2, y2, color, width = 1) {
  ctx.strokeStyle = color; ctx.lineWidth = width;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function ellipse(x, y, rx, ry, color) {
  ctx.fillStyle = color; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
}
function cover(image, x, y, w, h, cropTop, drift) {
  const sw = image.width, sh = image.height - cropTop;
  const scale = Math.max(w / sw, h / sh);
  const fromW = w / scale, fromH = h / scale;
  const fromX = (sw - fromW) / 2;
  const spareY = Math.max(0, sh - fromH);
  const fromY = cropTop + spareY * (.5 + .36 * drift);
  ctx.drawImage(image, fromX, fromY, fromW, fromH, x, y, w, h);
}
function screen(image, alternate, x, y, w, h, cropTop, altCropTop, t, offset) {
  ctx.save();
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 3); ctx.clip();
  cover(image, x, y, w, h, cropTop, Math.sin(phase(t) + offset));
  const wave = Math.sin(phase(t) - Math.PI / 2 - offset * .12);
  const crossfade = Math.max(0, Math.min(1, (wave + .2) / .4));
  ctx.globalAlpha = crossfade;
  cover(alternate, x, y, w, h, altCropTop, Math.sin(phase(t) + offset + 1));
  ctx.globalAlpha = 1;
  const shine = ctx.createLinearGradient(x, y, x + w, y + h);
  shine.addColorStop(0, "#ffffff23"); shine.addColorStop(.45, "#ffffff00"); shine.addColorStop(1, "#0915181d");
  ctx.fillStyle = shine; ctx.fillRect(x, y, w, h);
  ctx.restore();
}
function stone(x, y, w, h, top, front) {
  ctx.save();
  ctx.shadowColor = "#1b292744"; ctx.shadowBlur = 40; ctx.shadowOffsetY = 18;
  const side = ctx.createLinearGradient(x, y, x + w, y + h);
  side.addColorStop(0, front); side.addColorStop(1, "#10191c");
  rounded(x, y + 20, w, h - 20, 19, side);
  ctx.restore();
  const cap = ctx.createLinearGradient(x, y, x + w, y + 24);
  cap.addColorStop(0, top); cap.addColorStop(1, "#3c494b");
  rounded(x - 3, y, w + 6, 35, 17, cap);
  line(x + 15, y + 34, x + w - 15, y + 34, "#87919342");
  for (let i = 0; i < 5; i++) line(x + 20 + i * w / 6, y + 47 + i % 3 * 13, x + 58 + i * w / 6, y + 53 + i % 3 * 13, "#ffffff0b");
}
function background(t) {
  const bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, "#f0f1ec"); bg.addColorStop(.53, "#dfe5e1"); bg.addColorStop(1, "#cbd4d1");
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  const aura = ctx.createRadialGradient(570, 350, 40, 570, 350, 630);
  aura.addColorStop(0, "#e8f7b585"); aura.addColorStop(1, "#e8f7b500");
  ctx.fillStyle = aura; ctx.fillRect(0, 0, W, H);
  // Fine architectural lines make the scene feel like a designed set, not stock photography.
  line(0, 839, W, 839, "#9da9a559", 2);
  line(90, 0, 90, 980, "#ffffff5c");
  line(1002, 0, 1002, 980, "#ffffff4a");
  ellipse(555, 865, 450, 60, "#24353a1b");
  ellipse(175, 887, 165, 31, "#16242725");
  ellipse(930, 883, 166, 31, "#16242725");
}
function monitor(t) {
  const float = Math.sin(phase(t)) * 8;
  const x = 223, y = 150 + float, w = 695, h = 455;
  ctx.save();
  ctx.shadowColor = "#10202270"; ctx.shadowBlur = 42; ctx.shadowOffsetY = 23;
  rounded(536, y + h - 2, 71, 158, 9, "#263337");
  rounded(417, y + h + 143, 310, 23, 12, "#172428");
  rounded(x, y, w, h, 20, "#162127");
  ctx.restore();
  rounded(x + 10, y + 10, w - 20, h - 47, 10, "#dce3dc");
  screen(images.desktop, images.desktopAlt, x + 15, y + 15, w - 30, h - 57, 34, 144, t, .5);
  rounded(x + w / 2 - 13, y + h - 29, 26, 3, 2, "#7c8b89");
  line(x + 18, y + h - 41, x + w - 18, y + h - 41, "#65727155");
}
function tablet(t) {
  const float = Math.sin(phase(t) + 1.8) * 11;
  const x = 806, y = 516 + float, w = 268, h = 217;
  ctx.save();
  ctx.translate(x + w / 2, y + h / 2); ctx.rotate(-.075 + .013 * Math.sin(phase(t)));
  ctx.translate(-w / 2, -h / 2);
  ctx.shadowColor = "#0813169c"; ctx.shadowBlur = 28; ctx.shadowOffsetY = 18;
  rounded(0, 0, w, h, 16, "#172227");
  ctx.restore();
  ctx.save();
  ctx.translate(x + w / 2, y + h / 2); ctx.rotate(-.075 + .013 * Math.sin(phase(t)));
  ctx.translate(-w / 2, -h / 2);
  rounded(8, 8, w - 16, h - 16, 8, "#dfe5e0");
  screen(images.tablet, images.tabletAlt, 12, 12, w - 24, h - 24, 136, 144, t, 1.9);
  rounded(w - 7, h / 2 - 9, 3, 18, 1, "#33464a");
  ctx.restore();
}
function phone(t) {
  const float = Math.sin(phase(t) + 3.3) * 12;
  const x = 93, y = 421 + float, w = 178, h = 351;
  ctx.save();
  ctx.translate(x + w / 2, y + h / 2); ctx.rotate(.055 + .013 * Math.sin(phase(t) + 1));
  ctx.translate(-w / 2, -h / 2);
  ctx.shadowColor = "#071013a3"; ctx.shadowBlur = 29; ctx.shadowOffsetY = 18;
  rounded(0, 0, w, h, 27, "#101a1f");
  ctx.restore();
  ctx.save();
  ctx.translate(x + w / 2, y + h / 2); ctx.rotate(.055 + .013 * Math.sin(phase(t) + 1));
  ctx.translate(-w / 2, -h / 2);
  rounded(7, 7, w - 14, h - 14, 21, "#e8ede9");
  screen(images.mobile, images.mobileAlt, 10, 10, w - 20, h - 20, 115, 110, t, 3);
  rounded(w / 2 - 22, 10, 44, 10, 5, "#101a1f");
  ctx.restore();
}
function draw(t) {
  t = ((t % DURATION) + DURATION) % DURATION;
  ctx.clearRect(0, 0, W, H);
  background(t);
  stone(307, 811, 551, 123, "#374449", "#222e32");
  stone(28, 782, 285, 151, "#303d42", "#1c292e");
  stone(787, 777, 305, 159, "#344347", "#202e32");
  monitor(t); tablet(t); phone(t);
  const sheen = ctx.createLinearGradient(0, 0, W, H);
  sheen.addColorStop(0, "#ffffff10"); sheen.addColorStop(.5, "#ffffff00"); sheen.addColorStop(1, "#0716180b");
  ctx.fillStyle = sheen; ctx.fillRect(0, 0, W, H);
}
function download(blob, name) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
window.savePoster = async () => {
  await window.sceneReady; draw(0);
  download(await new Promise(resolve => canvas.toBlob(resolve, "image/webp", .9)), "hero-devices-poster.webp");
};
window.recordVideo = async () => {
  await window.sceneReady;
  const mimeType = "video/mp4;codecs=avc1.42E01E";
  if (!MediaRecorder.isTypeSupported(mimeType)) throw new Error("This Chrome build cannot record H.264 MP4");
  const stream = canvas.captureStream(24);
  const chunks = [], recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 2800000 });
  recorder.addEventListener("dataavailable", event => { if (event.data.size) chunks.push(event.data); });
  const finished = new Promise((resolve, reject) => {
    recorder.addEventListener("stop", resolve, { once: true });
    recorder.addEventListener("error", reject, { once: true });
  });
  draw(0); recorder.start();
  const start = performance.now();
  const paint = now => { draw((now - start) / 1000); if (recorder.state === "recording") requestAnimationFrame(paint); };
  requestAnimationFrame(paint);
  await new Promise(resolve => setTimeout(resolve, DURATION * 1000));
  recorder.stop(); await finished;
  stream.getTracks().forEach(track => track.stop());
  download(new Blob(chunks, { type: "video/mp4" }), "hero-devices.mp4");
};
window.sceneReady.then(() => draw(0));
</script>
</html>
