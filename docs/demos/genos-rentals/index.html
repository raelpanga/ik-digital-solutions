function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3000);}
function sms(to,text){state.sms.unshift({date:today()+" "+new Date().toTimeString().slice(0,5),to,text});}
function wstatus(w){if(w.status==="pending")return "pending";if(daysUntil(w.date)<0)return "archived";return "active";}
function dday(w){const n=daysUntil(w.date);if(n===0)return '<span class="tag bad">AUJOURD\'HUI</span>';if(n<0)return '<span class="tag info">passé</span>';return `<span class="tag ${n<=7?"bad":n<=21?"warn":"gold"}">J-${n}</span>`;}
function closeModal(){$("modal").innerHTML="";}

/* ---------- Stripe-like card modal ---------- */
function cardModal(amount, label, onOk){
  $("modal").innerHTML=`<div class="overlay"><div class="dialog" role="dialog" aria-modal="true"><div class="dlg-head"><h2>Paiement par carte</h2><span class="tag sandbox">Stripe simulé · aucun débit réel</span></div><div class="dlg-body" id="cm-body">
    <p class="muted">${esc(label)}</p>
    <div class="stripe"><div class="brand-s"><span>CHECKOUT</span><span>${usd(amount)}</span></div>
      <label class="field">Numéro de carte<input id="cm-num" value="4242 4242 4242 4242" inputmode="numeric"></label>
      <div class="frow"><label class="field">Expiration<input id="cm-exp" value="12/28"></label><label class="field">CVC<input id="cm-cvc" value="123"></label></div>
      <label class="field">Nom sur la carte<input id="cm-name" value="Lucas Martin"></label></div>
    <div class="dlg-actions"><button type="button" class="btn ghost" id="cm-cancel">Annuler</button><button type="button" class="btn primary" id="cm-pay">Payer ${usd(amount)}</button></div></div></div></div>`;
  $("cm-cancel").onclick=closeModal;
  $("cm-pay").onclick=()=>{$("cm-body").innerHTML=`<p>Transaction envoyée à Stripe…</p><div class="progress"><i></i></div><p class="muted">Le webhook « checkout.session.completed » mettra la commande à jour.</p>`;
    setTimeout(()=>{const ref="ch_"+Math.random().toString(36).slice(2,12);$("cm-body").innerHTML=`<p><span class="tag ok">Paiement confirmé</span></p><p class="mono">Réf. ${ref}</p><p class="muted">Reçu envoyé par SMS et e-mail (simulé).</p><div class="dlg-actions"><button type="button" class="btn primary" id="cm-close">Fermer</button></div>`;$("cm-close").onclick=()=>{closeModal();onOk(ref);};},1700);};
}
function recordPayment(o,amount,method,ref){amount=Math.min(amount,balance(o));o.paid=Math.round((o.paid+amount)*100)/100;state.payments.unshift({id:mkRef("PAY"),orderId:o.id,amount,method,ref:ref||"—",date:today()});sms(W(o.weddingId).phone,`Geno's & MAC&CLAY: paiement de ${usd(amount)} recu pour la commande ${o.id}. Solde restant ${usd(balance(o))}.`);save();}

/* ---------- Client: wizard ---------- */
function renderWizard(){
  const s=wiz.step;
  const head=`<div class="hero"><div><p class="muted" style="color:inherit;opacity:.75;font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase">Inscription de cortège</p><h1>Inscrivez votre mariage, composez les tenues, on s'occupe du reste.</h1><p>Chaque membre du cortège recevra son rendez-vous d'essayage par SMS. Les commandes sont créées en magasin, à l'essayage.</p></div><div class="gl">GFA</div></div>
    <div class="steps"><div class="${s===1?"on":""}">1 · Le mariage</div><div class="${s===2?"on":""}">2 · Les tenues</div><div class="${s===3?"on":""}">3 · Le cortège</div></div>`;
  let body="";
  if(s===1){
    body=`<form class="form" id="wz1"><div class="frow"><label class="field">Couple <small>ex. Emma & Lucas Martin</small><input id="z-couple" value="${esc(wiz.couple)}" required placeholder="Prénoms & nom"></label><label class="field">Marié (contact principal)<input id="z-groom" value="${esc(wiz.groom)}" required placeholder="Nom complet"></label></div>
      <div class="frow"><label class="field">Téléphone (SMS)<input id="z-phone" value="${esc(wiz.phone)}" required></label><label class="field">Date du mariage<input id="z-date" type="date" value="${wiz.date}" min="${addDays(today(),2)}" required></label></div>
      <div class="frow"><label class="field">Lieu<input id="z-venue" value="${esc(wiz.venue)}" placeholder="Salle, église, domaine"></label><label class="field">Magasin de retrait<select id="z-pickup">${LOC.map(l=>`<option ${l===wiz.pickup?"selected":""}>${l}</option>`).join("")}</select></label></div>
      <p class="muted">Retrait prévu le <strong class="mono" id="z-pick">${fmtDate(pickupFor(wiz.date))}</strong> · retour le <strong class="mono" id="z-ret">${fmtDate(returnFor(wiz.date))}</strong> (le lundi suivant le mariage).</p>
      <div class="dlg-actions"><button class="btn primary" type="submit">Continuer</button></div></form>`;
  } else if(s===2){
    body=`<div class="form"><div class="section-head"><div><h2>Composez les tenues</h2><p class="muted">Un « look » est une tenue complète. Vous pourrez l'attribuer à chaque membre à l'étape suivante.</p></div><button type="button" class="btn ghost small" id="z-addlook">+ Ajouter un look</button></div>
      ${wiz.looks.map((lk,li)=>`<div class="card"><div class="section-head"><label class="field" style="flex:1">Nom du look<input data-lname="${li}" value="${esc(lk.name)}"></label>${wiz.looks.length>1?`<button type="button" class="btn ghost small" data-dellook="${li}">Retirer</button>`:""}</div>
        ${CATS.map(([cat,label])=>`<div><p class="muted" style="margin-bottom:.35rem">${label}</p><div class="lookgrid">${INV.filter(i=>i.cat===cat).map(i=>`<div class="opt ${lk.items[cat]===i.code?"sel":""}" data-pick="${li}|${cat}|${i.code}" role="button" tabindex="0"><div class="swatch" style="background:${i.sw};border:1px solid var(--line)"></div><b>${esc(i.name)}</b><span>${usd(i.price)}</span></div>`).join("")}</div></div>`).join("")}
        <div class="total big"><span>Total du look (location)</span><span class="mono">${usd(lookTotal(lk))}</span></div></div>`).join("")}
      <div class="dlg-actions"><button type="button" class="btn ghost" id="z-back">Retour</button><button type="button" class="btn primary" id="z-next">Continuer</button></div></div>`;
  } else {
    body=`<div class="form"><div class="section-head"><div><h2>Le cortège</h2><p class="muted">Chaque membre recevra un SMS pour prendre son rendez-vous d'essayage.</p></div><button type="button" class="btn ghost small" id="z-addm">+ Ajouter un membre</button></div>
      ${wiz.members.map((m,i)=>`<div class="member-row"><input data-mname="${i}" value="${esc(m.name)}" placeholder="Nom complet" aria-label="Nom"><select data-mrole="${i}">${["Marié","Témoin","Garçon d'honneur","Père du marié","Père de la mariée","Porteur d'alliances"].map(r=>`<option ${r===m.role?"selected":""}>${r}</option>`).join("")}</select><select data-mlook="${i}">${wiz.looks.map(l=>`<option value="${l.id}" ${l.id===m.lookId?"selected":""}>${esc(l.name)}</option>`).join("")}</select><button type="button" class="btn ghost small" data-delm="${i}" ${wiz.members.length<=1?"disabled":""}>Retirer</button></div>`).join("")}
      <div class="total big"><span>Estimation pour ${wiz.members.length} membre(s), hors taxe et garantie</span><span class="mono">${usd(wiz.members.reduce((s,m)=>s+lookTotal(wiz.looks.find(l=>l.id===m.lookId)||wiz.looks[0]),0))}</span></div>
      <div class="dlg-actions"><button type="button" class="btn ghost" id="z-back">Retour</button><button type="button" class="btn gold" id="z-submit">Envoyer l'inscription</button></div></div>`;
  }
  $("view").innerHTML=`<div class="wizard">${head}${body}</div>`;
  const f1=$("wz1");if(f1){$("z-date").oninput=()=>{const d=$("z-date").value;if(d){$("z-pick").textContent=fmtDate(pickupFor(d));$("z-ret").textContent=fmtDate(returnFor(d));}};f1.onsubmit=e=>{e.preventDefault();wiz.couple=$("z-couple").value.trim();wiz.groom=$("z-groom").value.trim();wiz.phone=$("z-phone").value.trim();wiz.date=$("z-date").value;wiz.venue=$("z-venue").value.trim();wiz.pickup=$("z-pickup").value;if(!wiz.members[0].name)wiz.members[0].name=wiz.groom;wiz.step=2;renderWizard();};}
  document.querySelectorAll("[data-pick]").forEach(el=>{const h=()=>{const [li,cat,code]=el.dataset.pick.split("|");wiz.looks[li].items[cat]=code;renderWizard();};el.onclick=h;el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();h();}};});
  document.querySelectorAll("[data-lname]").forEach(i=>i.onchange=()=>{wiz.looks[i.dataset.lname].name=i.value.trim()||("Look "+(+i.dataset.lname+1));});
  document.querySelectorAll("[data-dellook]").forEach(b=>b.onclick=()=>{const id=wiz.looks[b.dataset.dellook].id;wiz.looks.splice(b.dataset.dellook,1);wiz.members.forEach(m=>{if(m.lookId===id)m.lookId=wiz.looks[0].id;});renderWizard();});
  const al=$("z-addlook");if(al)al.onclick=()=>{const n=wiz.looks.length+1;wiz.looks.push({id:"LN"+Date.now(),name:"Look "+n,items:{coat:"C102",pants:"P201",shirt:"S302",vest:"V401",tie:"T502",shoes:"H602"}});renderWizard();};
  const bk=$("z-back");if(bk)bk.onclick=()=>{wiz.step--;renderWizard();};
  const nx=$("z-next");if(nx)nx.onclick=()=>{wiz.step=3;renderWizard();};
  document.querySelectorAll("[data-mname]").forEach(i=>i.onchange=()=>{wiz.members[i.dataset.mname].name=i.value.trim();});
  document.querySelectorAll("[data-mrole]").forEach(i=>i.onchange=()=>{wiz.members[i.dataset.mrole].role=i.value;});
  document.querySelectorAll("[data-mlook]").forEach(i=>i.onchange=()=>{wiz.members[i.dataset.mlook].lookId=i.value;});
  document.querySelectorAll("[data-delm]").forEach(b=>b.onclick=()=>{wiz.members.splice(b.dataset.delm,1);renderWizard();});
  const am=$("z-addm");if(am)am.onclick=()=>{wiz.members.push({name:"",role:"Garçon d'honneur",lookId:wiz.looks[0].id});renderWizard();};
  const sb=$("z-submit");if(sb)sb.onclick=()=>{
    const members=wiz.members.filter(m=>m.name).map((m,i)=>({key:"n"+(i+1),name:m.name,role:m.role,lookId:m.lookId}));
    if(!members.length){toast("Indiquez au moins un membre.");return;}
    const w={id:"W"+Date.now(),couple:wiz.couple||"Nouveau couple",groom:wiz.groom,phone:wiz.phone,date:wiz.date,venue:wiz.venue,pickup:wiz.pickup,status:"pending",looks:wiz.looks.map(l=>({id:l.id,name:l.name,items:CATS.map(([c])=>l.items[c])})),members};
    state.weddings.unshift(w);state.groom=w.id;sms(w.phone,`Geno's & MAC&CLAY: inscription recue pour le mariage ${w.couple} (${fmtDate(w.date)}). Le magasin valide sous 24h.`);save();
    wiz={step:1,couple:"",groom:"",phone:"+1 859 555 0199",date:addDays(today(),45),venue:"",pickup:LOC[0],looks:[{id:"LN1",name:"Look 1",items:{coat:"C101",pants:"P201",shirt:"S301",vest:"V402",tie:"T501",shoes:"H601"}}],members:[{name:"",role:"Marié",lookId:"LN1"},{name:"",role:"Témoin",lookId:"LN1"}]};
    ctab="party";render();toast("Inscription envoyée. Le magasin doit l'approuver (vue Administration › Cortèges › En attente).");
  };
}
function lookTotal(lk){return CATS.reduce((s,[c])=>s+(item(lk.items[c])?item(lk.items[c]).price:0),0);}

/* ---------- Client: my party ---------- */
function renderParty(){
  const w=W(state.groom)||state.weddings[0];
  $("view").innerHTML=`<div class="section-head"><div><h1>Mon cortège</h1><p class="muted">Ce que le marié voit après connexion. Chaque carte suit un membre du cortège.</p></div><label class="muted">Connecté en tant que <select id="g-sel">${state.weddings.map(x=>`<option value="${x.id}" ${x.id===w.id?"selected":""}>${esc(x.groom)} · ${esc(x.couple)}</option>`).join("")}</select></label></div>
    <div class="card"><div class="section-head"><div><h2>${esc(w.couple)}</h2><p class="muted">${fmtDate(w.date)} · ${esc(w.venue||"lieu à préciser")} · retrait ${esc(w.pickup)}</p></div><div>${w.status==="pending"?'<span class="tag warn">en attente d\'approbation</span>':dday(w)}</div></div></div>
    <div class="grid">${w.members.map(m=>{const o=m.orderId?O(m.orderId):null;const lk=w.looks.find(l=>l.id===m.lookId);return `<div class="mcard ${o?"":"dash"}"><span class="role">${esc(m.role)}</span><h3>${esc(m.name)}</h3><p class="muted">${esc(lk?lk.name:"—")}${lk?" · "+lk.items.map(c=>item(c).name.split(" ")[0]).join(", "):""}</p>
      ${o?`<div class="total"><span>Commande ${o.id}</span><span class="mono">${usd(o.total)}</span></div><div class="total"><span>Payé</span><span class="mono">${usd(o.paid)}</span></div><div>${balance(o)>0?`<span class="tag warn">solde ${usd(balance(o))}</span> <button type="button" class="btn primary small" data-pay="${o.id}">Payer par carte</button>`:'<span class="tag ok">payé en totalité</span>'}</div><p class="muted">Retrait ${fmtDate(o.pickupDate)} · retour ${fmtDate(o.returnDate)} · ${esc(o.location)}</p>`
      :`<p><span class="tag gold">${w.status==="pending"?"tenue réservée":"en attente d'essayage"}</span></p><p class="muted">La commande sera créée en magasin lors de l'essayage, avec les tailles.</p>`}</div>`;}).join("")}</div>`;
  $("g-sel").onchange=()=>{state.groom=$("g-sel").value;save();renderParty();};
  document.querySelectorAll("[data-pay]").forEach(b=>b.onclick=()=>{const o=O(b.dataset.pay);cardModal(balance(o),`Commande ${o.id} · ${o.customer}`,ref=>{recordPayment(o,balance(o),"Carte (Stripe)",ref);renderParty();toast("Paiement enregistré, solde mis à jour.");});});
}

/* ---------- Admin ---------- */
function renderToday(){
  const t=today();
  const active=state.orders.filter(o=>o.status!=="retournée");
  const due=state.orders.reduce((s,o)=>s+balance(o),0);
  const customers=new Set(state.weddings.flatMap(w=>w.members.map(m=>m.name))).size;
  const pick=state.orders.filter(o=>o.pickupDate===t&&o.status==="ouverte"), ret=state.orders.filter(o=>o.returnDate<=t&&o.status==="retirée");
  const pending=state.weddings.filter(w=>w.status==="pending");
  $("view").innerHTML=`<div class="section-head"><div><h1>Tableau du jour · ${fmtDate(t)}</h1><p class="muted">Ce que l'équipe voit à l'ouverture du magasin.</p></div><button type="button" class="btn ghost small" id="reset">Réinitialiser la démo</button></div>
    <div class="kpis"><div class="kpi"><span class="l">Clients</span><span class="v">${customers}</span></div><div class="kpi"><span class="l">Commandes actives</span><span class="v">${active.length}</span></div><div class="kpi"><span class="l">Solde total dû</span><span class="v">${usd(due)}</span></div><div class="kpi"><span class="l">Inscriptions à approuver</span><span class="v">${pending.length}</span></div></div>
    <div class="two"><div class="card"><h2>Retraits du jour</h2><div class="list">${pick.length?pick.map(o=>`<div class="item"><span>${esc(o.customer)}<small>${esc(W(o.weddingId).couple)} · ${esc(o.location)}</small></span><button type="button" class="btn ghost small" data-pickup="${o.id}">Retiré</button></div>`).join(""):'<div class="item"><span class="muted">Aucun retrait prévu aujourd\'hui.</span></div>'}</div></div>
    <div class="card"><h2>Retours attendus</h2><div class="list">${ret.length?ret.map(o=>`<div class="item"><span>${esc(o.customer)}<small>attendu le ${fmtDate(o.returnDate)}</small></span><button type="button" class="btn ghost small" data-return="${o.id}">Retourné</button></div>`).join(""):'<div class="item"><span class="muted">Aucun retour en attente.</span></div>'}</div></div></div>
    <div class="card"><h2>Inscriptions en attente d'approbation</h2><div class="list">${pending.length?pending.map(w=>`<div class="item"><span>${esc(w.couple)}<small>${fmtDate(w.date)} · ${w.members.length} membres · ${esc(w.venue||"")}</small></span><button type="button" class="btn primary small" data-open="${w.id}">Examiner</button></div>`).join(""):'<div class="item"><span class="muted">Rien à approuver. Inscrivez un mariage depuis l\'Espace client.</span></div>'}</div></div>`;
  $("reset").onclick=()=>{state=seed();save();render();toast("Données de démonstration réinitialisées");};
  document.querySelectorAll("[data-pickup]").forEach(b=>b.onclick=()=>{O(b.dataset.pickup).status="retirée";save();renderToday();});
  document.querySelectorAll("[data-return]").forEach(b=>b.onclick=()=>{O(b.dataset.return).status="retournée";save();renderToday();});
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{sel=b.dataset.open;atab="weddings";render();});
}
let wtab="active";
function renderWeddings(){
  if(sel){renderWedding(W(sel));return;}
  const t=today();
  const groups={active:w=>wstatus(w)==="active",week:w=>wstatus(w)==="active"&&daysUntil(w.date)<=7,pending:w=>w.status==="pending",archived:w=>wstatus(w)==="archived"};
  const list=state.weddings.filter(groups[wtab]).sort((a,b)=>a.date<b.date?-1:1);
  const counts=Object.keys(groups).map(k=>state.weddings.filter(groups[k]).length);
  let html=`<div class="section-head"><div><h1>Cortèges de mariage</h1><p class="muted">${state.weddings.length} mariages · cliquez une carte pour ouvrir le dossier.</p></div><button type="button" class="btn primary small" id="newreg">+ Nouvelle inscription (espace client)</button></div>
    <div class="tabs" role="tablist">${[["active","Actifs"],["week","Cette semaine"],["pending","En attente"],["archived","Archives"]].map(([k,l],i)=>`<button type="button" role="tab" data-wtab="${k}" aria-selected="${wtab===k}">${l} (${counts[i]})</button>`).join("")}</div>`;
  let lastMonth="";html+='<div class="grid">';
  list.forEach(w=>{const m=monthOf(w.date);if(m!==lastMonth){html+=`<div class="month">${m}</div>`;lastMonth=m;}const done=w.members.filter(x=>x.orderId).length;const bal=state.orders.filter(o=>o.weddingId===w.id).reduce((s,o)=>s+balance(o),0);
    html+=`<div class="wcard" data-open="${w.id}" role="button" tabindex="0"><div class="date"><span>${fmtDate(w.date)}</span>${w.status==="pending"?'<span class="tag warn">à approuver</span>':dday(w)}</div><h3>${esc(w.couple)}</h3><p class="muted">${w.members.length} membres · ${esc(w.venue||"")}</p><div class="bar"><i style="width:${Math.round(done/w.members.length*100)}%"></i></div><div class="total"><span class="muted">Essayages ${done}/${w.members.length}</span><span class="mono" style="color:${bal>0?"var(--bad)":"var(--ok)"}">${bal>0?usd(bal)+" dû":"Payé"}</span></div></div>`;});
  if(!list.length)html+='<p class="muted">Aucun mariage dans cet onglet.</p>';
  html+="</div>";$("view").innerHTML=html;
  document.querySelectorAll("[data-wtab]").forEach(b=>b.onclick=()=>{wtab=b.dataset.wtab;renderWeddings();});
  document.querySelectorAll("[data-open]").forEach(el=>{const h=()=>{sel=el.dataset.open;renderWeddings();};el.onclick=h;el.onkeydown=e=>{if(e.key==="Enter"){h();}};});
  $("newreg").onclick=()=>{mode="client";ctab="register";render();};
}
function renderWedding(w){
  const orders=state.orders.filter(o=>o.weddingId===w.id);
  $("view").innerHTML=`<a href="#" id="back" class="muted">← Tous les cortèges</a>
    <div class="section-head"><div><h1>${esc(w.couple)}</h1><p class="muted">${fmtDate(w.date)} · ${esc(w.venue||"lieu à préciser")} · retrait ${esc(w.pickup)} · contact ${esc(w.groom)} ${esc(w.phone)}</p></div><div>${w.status==="pending"?`<button type="button" class="btn gold" id="approve">Approuver l'inscription</button>`:dday(w)}</div></div>
    ${w.status==="pending"?`<div class="card" style="border-left:4px solid var(--warn)"><strong>Inscription à examiner.</strong><p class="muted">L'approbation crée les fiches clients et envoie les rendez-vous d'essayage par SMS. Les commandes seront créées à l'essayage, avec les tailles.</p></div>`:""}
    <div class="two"><div class="card"><h2>Tenues réservées</h2>${w.looks.map(l=>`<div><strong>${esc(l.name)}</strong> <span class="mono muted">${usd(l.items.reduce((s,c)=>s+item(c).price,0))}</span><p class="muted">${l.items.map(c=>esc(item(c).name)).join(" · ")}</p></div>`).join("")}</div>
    <div class="card"><h2>Solde du cortège</h2><div class="total"><span>Commandes créées</span><span class="mono">${orders.length}/${w.members.length}</span></div><div class="total"><span>Total commandé</span><span class="mono">${usd(orders.reduce((s,o)=>s+o.total,0))}</span></div><div class="total big"><span>Reste dû</span><span class="mono">${usd(orders.reduce((s,o)=>s+balance(o),0))}</span></div></div></div>
    <h2>Cortège · commandes créées à l'essayage</h2>
    <div class="tablewrap"><table><thead><tr><th>Membre</th><th>Rôle</th><th>Look</th><th>Statut</th><th>Solde</th><th></th></tr></thead><tbody>
    ${w.members.map(m=>{const o=m.orderId?O(m.orderId):null;const lk=w.looks.find(l=>l.id===m.lookId);return `<tr><td>${esc(m.name)}</td><td>${esc(m.role)}</td><td>${esc(lk?lk.name:"—")}</td><td>${o?`<span class="tag ${o.status==="retournée"?"info":"ok"}">commande ${o.id} · ${o.status}</span>`:w.status==="pending"?'<span class="tag warn">client à créer</span>':'<span class="tag gold">en attente d\'essayage</span>'}</td><td class="num">${o?usd(balance(o)):"—"}</td><td>${!o&&w.status!=="pending"?`<button type="button" class="btn primary small" data-order="${m.key}">+ Créer la commande</button>`:o&&balance(o)>0?`<button type="button" class="btn ghost small" data-collect="${o.id}">Encaisser</button>`:""}</td></tr>`;}).join("")}
    </tbody></table></div>`;
  $("back").onclick=e=>{e.preventDefault();sel=null;renderWeddings();};
  const ap=$("approve");if(ap)ap.onclick=()=>{w.status="approved";w.members.forEach(m=>sms("+1 859 555 01"+Math.floor(Math.random()*90+10),`Geno's & MAC&CLAY: ${m.name}, votre tenue pour le mariage ${w.couple} est reservee. Prenez rendez-vous pour l'essayage a ${w.pickup}.`));save();renderWedding(w);toast("Inscription approuvée : fiches clients créées, SMS d'essayage envoyés (simulé).");};
  document.querySelectorAll("[data-order]").forEach(b=>b.onclick=()=>orderModal(w,w.members.find(m=>m.key===b.dataset.order)));
  document.querySelectorAll("[data-collect]").forEach(b=>b.onclick=()=>collectModal(O(b.dataset.collect),()=>renderWedding(w)));
}
function orderModal(w,m){
  const lk=w.looks.find(l=>l.id===m.lookId)||w.looks[0];
  const sizes={coat:"42R",pants:"34",shirt:"16",shoes:"11"};
  const calc=()=>{const disc=parseFloat($("om-disc").value)||0;const sub=lk.items.reduce((s,c)=>s+item(c).price,0);const tax=Math.round((sub-disc)*TAX*100)/100;$("om-sub").textContent=usd(sub);$("om-tax").textContent=usd(tax);$("om-total").textContent=usd(Math.round((sub-disc+tax+WAIVER)*100)/100);};
  $("modal").innerHTML=`<div class="overlay"><div class="dialog" role="dialog" aria-modal="true"><div class="dlg-head"><div><h2>Créer la commande · ${esc(m.name)}</h2><p class="muted">${esc(m.role)} · ${esc(w.couple)} · pré-remplie depuis « ${esc(lk.name)} »</p></div></div><div class="dlg-body">
    <p class="muted">Le personnel ne saisit que les tailles ; le reste vient de l'inscription.</p>
    ${lk.items.map(c=>{const i=item(c);const sz=SIZES[i.cat];return `<div class="total"><span>${esc(i.name)}${sz?` · <select data-size="${i.cat}" aria-label="Taille">${sz.map(s=>`<option ${s===sizes[i.cat]?"selected":""}>${s}</option>`).join("")}</select>`:' <span class="muted">taille unique</span>'}</span><span class="mono">${usd(i.price)}</span></div>`;}).join("")}
    <div class="frow"><label class="field">Magasin de retrait<select id="om-loc">${LOC.map(l=>`<option ${l===w.pickup?"selected":""}>${l}</option>`).join("")}</select></label><label class="field">Remise (USD)<input id="om-disc" type="number" min="0" step="1" value="0"></label></div>
    <div class="frow"><label class="field">Retrait <small>mariage − 4 jours</small><input id="om-pick" type="date" value="${pickupFor(w.date)}"></label><label class="field">Retour <small>lundi suivant</small><input id="om-ret" type="date" value="${returnFor(w.date)}"></label></div>
    <div class="total"><span>Sous-total</span><span class="mono" id="om-sub"></span></div><div class="total"><span>Taxe 6 %</span><span class="mono" id="om-tax"></span></div><div class="total"><span>Garantie dommages</span><span class="mono">${usd(WAIVER)}</span></div><div class="total big"><span>Total</span><span class="mono" id="om-total"></span></div>
    <div class="dlg-actions"><button type="button" class="btn ghost" id="om-cancel">Annuler</button><button type="button" class="btn primary" id="om-ok">Créer la commande</button></div></div></div></div>`;
  calc();$("om-disc").oninput=calc;$("om-cancel").onclick=closeModal;
  $("om-ok").onclick=()=>{document.querySelectorAll("[data-size]").forEach(s=>{sizes[s.dataset.size]=s.value;});const o=mkOrder(w,m,lk,sizes,{discount:parseFloat($("om-disc").value)||0,location:$("om-loc").value,pickup:$("om-pick").value,ret:$("om-ret").value});state.orders.unshift(o);m.orderId=o.id;sms(w.phone,`Geno's & MAC&CLAY: commande ${o.id} creee pour ${m.name}. Total ${usd(o.total)}. Retrait ${fmtDate(o.pickupDate)}.`);save();closeModal();renderWedding(w);toast("Commande "+o.id+" créée. Visible dans Commandes et Comptes.");};
}
function collectModal(o,after){
  $("modal").innerHTML=`<div class="overlay"><div class="dialog" role="dialog" aria-modal="true"><div class="dlg-head"><h2>Encaisser · ${esc(o.customer)}</h2><span class="tag sandbox">simulé</span></div><div class="dlg-body">
    <div class="total"><span>Commande ${o.id}</span><span class="mono">${usd(o.total)}</span></div><div class="total big"><span>Solde</span><span class="mono">${usd(balance(o))}</span></div>
    <div class="frow"><label class="field">Montant (USD)<input id="cl-amt" type="number" min="1" step="0.01" max="${balance(o)}" value="${balance(o)}"></label><label class="field">Mode<select id="cl-m"><option>Carte (Stripe)</option><option>Espèces</option></select></label></div>
    <div class="dlg-actions"><button type="button" class="btn ghost" id="cl-cancel">Annuler</button><button type="button" class="btn primary" id="cl-ok">Encaisser</button></div></div></div></div>`;
  $("cl-cancel").onclick=closeModal;
  $("cl-ok").onclick=()=>{const amt=Math.max(0.01,parseFloat($("cl-amt").value)||0);const m=$("cl-m").value;if(m==="Carte (Stripe)"){cardModal(amt,`Commande ${o.id} · ${o.customer}`,ref=>{recordPayment(o,amt,m,ref);after();});}else{recordPayment(o,amt,m);closeModal();after();toast("Paiement en espèces enregistré.");}};
}
function renderOrders(){
  $("view").innerHTML=`<div class="section-head"><div><h1>Commandes</h1><p class="muted">Toutes les commandes, avec leur mariage et leur solde.</p></div></div>
    <div class="tablewrap"><table><thead><tr><th>N°</th><th>Client</th><th>Mariage</th><th>Retrait</th><th>Retour</th><th>Total</th><th>Payé</th><th>Solde</th><th>Statut</th><th></th></tr></thead><tbody>
    ${state.orders.map(o=>`<tr><td class="num">${esc(o.id)}</td><td>${esc(o.customer)}<br><span class="muted">${esc(o.role)}</span></td><td>${esc(W(o.weddingId).couple)}</td><td class="num">${fmtDate(o.pickupDate).slice(0,11)}</td><td class="num">${fmtDate(o.returnDate).slice(0,11)}</td><td class="num">${usd(o.total)}</td><td class="num">${usd(o.paid)}</td><td class="num" style="color:${balance(o)>0?"var(--bad)":"var(--ok)"}">${usd(balance(o))}</td><td><span class="tag ${o.status==="retournée"?"info":o.status==="retirée"?"gold":"ok"}">${o.status}</span></td><td style="white-space:nowrap">${balance(o)>0?`<button type="button" class="btn ghost small" data-collect="${o.id}">Encaisser</button> `:""}${o.status==="ouverte"?`<button type="button" class="btn ghost small" data-st="${o.id}|retirée">Retiré</button>`:o.status==="retirée"?`<button type="button" class="btn ghost small" data-st="${o.id}|retournée">Retourné</button>`:""}</td></tr>`).join("")}
    </tbody></table></div>`;
  document.querySelectorAll("[data-collect]").forEach(b=>b.onclick=()=>collectModal(O(b.dataset.collect),renderOrders));
  document.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{const [id,st]=b.dataset.st.split("|");O(id).status=st;save();renderOrders();});
}
function renderAccounts(){
  const t=today();
  const due=state.orders.filter(o=>balance(o)>0).sort((a,b)=>a.pickupDate<b.pickupDate?-1:1);
  $("view").innerHTML=`<div class="section-head"><div><h1>Comptes à encaisser</h1><p class="muted">Toutes les commandes avec un solde, les plus urgentes en premier.</p></div><span class="tag bad">${usd(due.reduce((s,o)=>s+balance(o),0))} dû</span></div>
    <div class="tablewrap"><table><thead><tr><th>Urgence</th><th>Client</th><th>Mariage</th><th>Retrait</th><th>Solde</th><th></th></tr></thead><tbody>
    ${due.length?due.map(o=>{const n=daysUntil(o.pickupDate);return `<tr><td>${n<0?'<span class="tag bad">en retard</span>':n===0?'<span class="tag bad">aujourd\'hui</span>':`<span class="tag ${n<=3?"warn":"info"}">J-${n}</span>`}</td><td>${esc(o.customer)}</td><td>${esc(W(o.weddingId).couple)}</td><td class="num">${fmtDate(o.pickupDate)}</td><td class="num">${usd(balance(o))}</td><td><button type="button" class="btn primary small" data-collect="${o.id}">Enregistrer un paiement</button></td></tr>`;}).join(""):'<tr><td colspan="6" class="muted">Aucun solde dû.</td></tr>'}
    </tbody></table></div>`;
  document.querySelectorAll("[data-collect]").forEach(b=>b.onclick=()=>collectModal(O(b.dataset.collect),renderAccounts));
}
function renderMessages(){
  $("view").innerHTML=`<div class="section-head"><div><h1>Messages envoyés</h1><p class="muted">SMS envoyés par l'application (Twilio en production, simulé ici).</p></div></div><div class="list">${state.sms.length?state.sms.map(s=>`<div class="item"><span><div class="sms">${esc(s.text)}</div><small>${esc(s.date)} · à ${esc(s.to)}</small></span></div>`).join(""):'<p class="muted">Aucun message.</p>'}</div>`;
}

/* ---------- shell ---------- */
function render(){
  document.querySelectorAll("[data-mode]").forEach(b=>b.setAttribute("aria-selected",b.dataset.mode===mode?"true":"false"));
  const pending=state.weddings.filter(w=>w.status==="pending").length, due=state.orders.filter(o=>balance(o)>0).length;
  const items=mode==="client"?[["register","Inscrire un mariage"],["party","Mon cortège"]]:[["today","Tableau du jour"],["weddings","Cortèges",pending],["orders","Commandes"],["accounts","Comptes",due],["messages","Messages"]];
  const cur=mode==="client"?ctab:atab;
  $("subnav").innerHTML=items.map(([k,l,n])=>`<button type="button" data-tab="${k}" aria-current="${cur===k}">${l}${n?` <span class="badge">${n}</span>`:""}</button>`).join("");
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{if(mode==="client")ctab=b.dataset.tab;else{atab=b.dataset.tab;sel=null;}render();});
  if(mode==="client"){ctab==="register"?renderWizard():renderParty();}
  else{({today:renderToday,weddings:renderWeddings,orders:renderOrders,accounts:renderAccounts,messages:renderMessages})[atab]();}
}
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;sel=null;render();});
render();
})();
</script>
</body></html>
