<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sotramines Services · Démo Portail Sous-traitant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#F6F4F0;--surface:#FFFFFF;--surface-2:#EDE9E1;--ink:#1E1A14;--ink-2:#5B5346;--ink-3:#8A8172;--line:#DDD6CA;--accent:#B45309;--accent-soft:#FBEBDD;--on-accent:#FFFFFF;--ok:#1E7F48;--ok-soft:#DDF3E5;--warn:#8F6210;--warn-soft:#F8EDD3;--bad:#B3261E;--bad-soft:#F9E0DE;--copper:#A84E27;--copper-soft:#F7E7DE;--radius:6px;--font:"Instrument Sans","Segoe UI",Arial,sans-serif;--display:"Bricolage Grotesque","Arial Narrow",Arial,sans-serif;--mono:"IBM Plex Mono",Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15120E;--surface:#1E1A14;--surface-2:#28231B;--ink:#EEE9E0;--ink-2:#BBB1A2;--ink-3:#8A8172;--line:#3A3328;--accent:#F0A458;--accent-soft:#3C2A15;--on-accent:#15120E;--ok:#4FCB84;--ok-soft:#163326;--warn:#E3B75C;--warn-soft:#3A2E12;--bad:#F08A80;--bad-soft:#3B1A17;--copper:#E08B5D;--copper-soft:#3A241A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15120E;--surface:#1E1A14;--surface-2:#28231B;--ink:#EEE9E0;--ink-2:#BBB1A2;--ink-3:#8A8172;--line:#3A3328;--accent:#F0A458;--accent-soft:#3C2A15;--on-accent:#15120E;--ok:#4FCB84;--ok-soft:#163326;--warn:#E3B75C;--warn-soft:#3A2E12;--bad:#F08A80;--bad-soft:#3B1A17;--copper:#E08B5D;--copper-soft:#3A241A;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;padding-inline:clamp(16px,3vw,32px);padding-block:0 48px}
h1,h2,h3{margin:0;font-family:var(--display);line-height:1.15;text-wrap:balance}
h1{font-size:clamp(1.5rem,3.5vw,2.2rem)}h2{font-size:1.25rem}h3{font-size:1.05rem}
p{margin:0}a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ikbar{margin-inline:calc(-1*clamp(16px,3vw,32px));background:var(--copper-soft);border-bottom:1px solid var(--line);padding:.45rem clamp(16px,3vw,32px);font-size:.82rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.ikbar strong{color:var(--copper)}.ikbar a{color:var(--ink-2)}
.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;padding-block:1.1rem;border-bottom:1px solid var(--line)}
.brand{display:grid}.brand span{font-family:var(--display);font-weight:700;font-size:1.35rem}.brand small{color:var(--ink-3);font-size:.8rem}
.tools{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
select,input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:.6rem .7rem;width:100%}
textarea{min-height:90px;resize:vertical}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.tabs button{font:inherit;font-weight:600;font-size:.9rem;background:transparent;color:var(--ink-2);border:0;padding:.5rem .9rem;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.switch{display:flex;align-items:center;gap:.5rem;font-size:.85rem;cursor:pointer;user-select:none;background:none;border:0;color:var(--ink);font-family:inherit}
.switch i{width:40px;height:22px;border-radius:11px;background:var(--ink-3);position:relative;display:inline-block}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff}
.switch.on i{background:var(--ok)}.switch.on i::after{left:21px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font:inherit;font-weight:600;font-size:.95rem;padding:.7rem 1rem;border-radius:4px;border:1px solid transparent;cursor:pointer;text-decoration:none;line-height:1.2}
.btn.primary{background:var(--accent);color:var(--on-accent)}.btn.ghost{background:transparent;border-color:var(--ink-3);color:var(--ink)}.btn.small{padding:.4rem .7rem;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
main{padding-top:1.4rem;display:grid;gap:1.4rem}
.muted{color:var(--ink-3);font-size:.85rem}
.banner{background:var(--warn-soft);border-left:4px solid var(--warn);padding:.7rem 1rem;border-radius:0 4px 4px 0;font-size:.9rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:center}
.banner.ok{background:var(--ok-soft);border-color:var(--ok)}
.phone{max-width:460px;margin-inline:auto;display:grid;gap:1rem}
.bigbtns{display:grid;gap:.7rem}
.bigbtn{display:grid;gap:.2rem;text-align:left;font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:1.1rem 1.2rem;cursor:pointer}
.bigbtn strong{font-size:1.15rem;font-family:var(--display)}.bigbtn span{color:var(--ink-3);font-size:.88rem}
.bigbtn:hover{border-color:var(--accent)}
.form{display:grid;gap:.9rem;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:1.2rem}
.field{display:grid;gap:.3rem;font-size:.9rem;font-weight:600}
.field small{font-weight:400;color:var(--ink-3)}
.sev{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem}
.sev label{display:grid;place-items:center;padding:.7rem .3rem;border:1px solid var(--line);border-radius:4px;cursor:pointer;font-family:var(--mono);font-size:.85rem}
.sev input{display:none}.sev input:checked+span{color:var(--on-accent)}.sev label:has(input:checked){background:var(--accent);border-color:var(--accent)}
.checklist{display:grid;gap:.5rem}
.checkrow{display:grid;grid-template-columns:1fr auto;gap:.6rem;align-items:center;padding:.6rem .8rem;border:1px solid var(--line);border-radius:4px}
.okko{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.okko label{padding:.45rem .8rem;cursor:pointer;font-family:var(--mono);font-size:.85rem}
.okko input{display:none}.okko label:has(input:checked){background:var(--ink);color:var(--bg)}
.thumb{width:72px;height:72px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:.9rem 1rem;display:grid;gap:.2rem}
.kpi .l{font-size:.75rem;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;font-family:var(--mono)}
.kpi .v{font-family:var(--mono);font-size:1.5rem;font-variant-numeric:tabular-nums}
.kpi.bad .v{color:var(--bad)}.kpi.warn .v{color:var(--warn)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:.92rem}
th,td{text-align:left;padding:.6rem .8rem;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:500;background:var(--surface-2)}
tr:last-child td{border-bottom:0}td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;padding:.15rem .45rem;border-radius:3px;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.info{background:var(--accent-soft);color:var(--accent)}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:1rem;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:4px;font-size:.9rem;z-index:110}
.apphead{background:linear-gradient(rgba(24,18,10,.5),rgba(24,18,10,.8)),url('../assets/mining/haul.jpg') center/cover;color:#fff;border-radius:16px;padding:1.3rem 1.3rem 1.1rem;display:grid;gap:.9rem;position:relative;overflow:hidden}
.mgr-hero{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:21/7;background:var(--surface-2)}
.mgr-hero img{width:100%;height:100%;object-fit:cover;display:block}
.mgr-hero span{position:absolute;left:0;right:0;bottom:0;padding:1.3rem 1rem .7rem;background:linear-gradient(transparent,rgba(24,18,10,.85));color:#fff;font-size:.85rem;font-weight:600}
.credits{font-size:.74rem;color:var(--ink-3);line-height:1.5;margin-top:1rem}.credits a{color:var(--ink-2)}
.apphead::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.14)}
.apphead .who{display:flex;justify-content:space-between;align-items:center;gap:.8rem}
.apphead .eyebrow{font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.apphead h1{color:#fff;font-size:1.5rem}
.apphead .av{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-family:var(--display);font-weight:700}
.apphead .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;position:relative}
.apphead .m{background:rgba(255,255,255,.16);border-radius:10px;padding:.6rem .7rem;display:grid;gap:.05rem}
.apphead .m b{font-family:var(--mono);font-size:1.25rem;font-weight:500}.apphead .m span{font-size:.72rem;opacity:.85}
.bigbtn{grid-template-columns:auto 1fr;column-gap:.9rem;align-items:center}
.bigbtn .ic{grid-row:span 2;width:48px;height:48px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.bigbtn .ic svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.recent{display:grid;gap:.5rem}.recent .r{display:grid;grid-template-columns:1fr auto;gap:.6rem;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.6rem .8rem;font-size:.88rem}
.recent .r small{display:block;color:var(--ink-3)}
.h2s{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem}.h2s h2{font-size:1.05rem}
#report{display:none}
@media print{
  body{padding:0;background:#fff;color:#000}
  .ikbar,.top,main{display:none!important}
  #report{display:block;font-family:Arial,sans-serif;font-size:12px;color:#000}
  #report h1{font-size:18px;margin:0 0 4px}#report h2{font-size:14px;margin:16px 0 6px}
  #report table{width:100%;border-collapse:collapse;min-width:0}#report th,#report td{border:1px solid #999;padding:4px 6px;font-size:11px}
}
</style>
</head>
<body>
<div class="ikbar"><span><strong>Démonstrateur IK Digital Solutions</strong> · entreprise fictive · données d'exemple</span><a href="../../index.html">← Retour au portfolio</a></div>

<header class="top">
  <div class="brand"><span>Sotramines Services SARL</span><small>Exemple · sous-traitant terrassement et maintenance · site de Kolwezi, Lualaba</small></div>
  <div class="tools">
    <button type="button" class="switch" id="net" aria-pressed="false"><i></i><span>Réseau sur site : hors ligne</span></button>
    <div class="tabs" role="tablist" aria-label="Vue">
      <button type="button" role="tab" data-view="field" aria-selected="true">Terrain (mobile)</button>
      <button type="button" role="tab" data-view="mgr" aria-selected="false">Responsable</button>
    </div>
  </div>
</header>

<main id="view"></main>
<div id="report" aria-hidden="true"></div>

<script>
(function(){
"use strict";
const KEY="ik-demo-soustraitant-v1";
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=id=>document.getElementById(id);
const today=()=>new Date().toISOString().slice(0,10);
const now=()=>new Date().toTimeString().slice(0,5);
const mkRef=p=>p+"-"+Math.random().toString(36).slice(2,7).toUpperCase();
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10);};
const daysUntil=d=>Math.round((new Date(d)-new Date(today()))/86400000);
const fmtDate=d=>new Date(d+"T00:00:00").toLocaleDateString("fr-FR",{day:"2-digit",month:"short",year:"numeric"});

const EQUIP=[{id:"CB-12",name:"Camion benne CB-12"},{id:"EX-3",name:"Excavatrice EX-3"},{id:"GE-7",name:"Groupe électrogène GE-7"},{id:"CT-2",name:"Citerne à eau CT-2"}];
const CHECK=["Freins et direction","Pneus / chenilles","Niveaux (huile, hydraulique, eau)","Feux, avertisseur, gyrophare","Extincteur présent et en date","Ceintures et arrêt d'urgence"];
const STAFF=["Kabongo Mwamba","Ilunga Tshiala","Mutombo Kasongo","Ngoy Banza"];
const TYPES=["Presque-accident","Blessure légère","Blessure grave","Dommage matériel","Incident environnemental"];

function seed(){
  const t=today();
  return {
    incidents:[
      {id:mkRef("INC"),date:addDays(t,-2),time:"10:20",type:"Presque-accident",sev:2,place:"Zone de chargement B",desc:"Recul du CB-12 sans guide au sol, ouvrier à 3 m.",by:"Kabongo Mwamba",status:"ouvert",sample:true},
      {id:mkRef("INC"),date:addDays(t,-6),time:"15:05",type:"Dommage matériel",sev:1,place:"Piste d'accès nord",desc:"Rétroviseur EX-3 cassé contre un rocher.",by:"Ilunga Tshiala",status:"clôturé",sample:true}
    ],
    inspections:[
      {equip:"CB-12",date:addDays(t,-3),ok:6,ko:0,by:"Mutombo Kasongo"},
      {equip:"EX-3",date:addDays(t,-12),ok:5,ko:1,by:"Ilunga Tshiala"},
      {equip:"GE-7",date:addDays(t,-1),ok:6,ko:0,by:"Ngoy Banza"}
    ],
    clock:[{name:"Kabongo Mwamba",date:t,in:"06:55",out:null},{name:"Ilunga Tshiala",date:t,in:"07:02",out:null}],
    docs:[
      {name:"Assurance responsabilité civile",ref:"POL-44821",exp:addDays(t,120)},
      {name:"Agrément ARSP (sous-traitance)",ref:"ARSP-2025-0311",exp:addDays(t,22)},
      {name:"Certificat de conformité équipements",ref:"CCE-19",exp:addDays(t,-4)},
      {name:"Attestation fiscale (DGI)",ref:"DGI-7731",exp:addDays(t,58)},
      {name:"Registre du personnel (INPP)",ref:"INPP-2026",exp:addDays(t,200)}
    ],
    queue:[]
  };
}
function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s);}catch(e){}return seed();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
let state=load(), view="field", online=false, screen="home", photo=null;
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2800);}

function push(item){ if(online){apply(item);toast("Envoyé au bureau.");} else {state.queue.push(item);toast("Sans réseau : enregistré sur le téléphone ("+state.queue.length+" en attente).");} save(); }
function apply(item){ if(item.kind==="incident")state.incidents.unshift(item.data); else if(item.kind==="inspection")state.inspections.unshift(item.data); else if(item.kind==="clock")state.clock.unshift(item.data); }
function syncAll(){ state.queue.forEach(apply); const n=state.queue.length; state.queue=[]; save(); render(); toast(n+" élément(s) synchronisé(s) via 4G / Starlink."); }

function netBanner(){
  if(online) return state.queue.length?`<div class="banner ok">Réseau disponible. ${state.queue.length} élément(s) en attente. <button type="button" class="btn primary small" id="sync">Synchroniser</button></div>`:"";
  return `<div class="banner">Pas de réseau sur site (simulé). Tout ce que vous saisissez reste sur le téléphone. En attente : <strong>${state.queue.length}</strong>. Passez en ligne pour synchroniser.</div>`;
}
function bindSync(){const b=$("sync");if(b)b.onclick=syncAll;}

function renderField(){
  let inner="";
  if(screen==="home"){
    const t=today();
    const recent=[...state.queue.map(q=>({...q,pending:true})),...state.incidents.slice(0,2).map(i=>({kind:"incident",data:i})),...state.inspections.slice(0,2).map(i=>({kind:"inspection",data:i}))].slice(0,4);
    const lbl=r=>r.kind==="incident"?`Incident · ${r.data.type}`:r.kind==="inspection"?`Inspection · ${(EQUIP.find(e=>e.id===r.data.equip)||{}).name||r.data.equip}`:`Pointage · ${r.data.name}`;
    const sub=r=>r.pending?"En attente de réseau":r.kind==="incident"?`${fmtDate(r.data.date)} · ${r.data.place}`:r.kind==="inspection"?`${fmtDate(r.data.date)} · ${r.data.ko?r.data.ko+" point(s) KO":"6/6 OK"}`:`${fmtDate(r.data.date)} · entrée ${r.data.in}`;
    inner=`<div class="apphead">
      <div class="who"><div><p class="eyebrow">Site de Kolwezi · contrat terrassement</p><h1>Équipe A · ${new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}</h1></div><div class="av">KM</div></div>
      <div class="row3"><div class="m"><b>${state.clock.filter(c=>c.date===t&&!c.out).length}</b><span>présents</span></div><div class="m"><b>${state.incidents.filter(i=>i.status==="ouvert").length}</b><span>incidents ouverts</span></div><div class="m"><b>${state.queue.length}</b><span>à synchroniser</span></div></div>
    </div>
    <div class="bigbtns">
      <button type="button" class="bigbtn" data-go="incident"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 3 2.5 20h19L12 3z"/><path d="M12 9v5"/><circle cx="12" cy="17" r=".6"/></svg></span><strong>Déclarer un incident</strong><span>Presque-accident, blessure, dommage, environnement</span></button>
      <button type="button" class="bigbtn" data-go="inspect"><span class="ic"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v2h6V3"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg></span><strong>Inspection d'équipement</strong><span>Checklist avant démarrage, 6 points</span></button>
      <button type="button" class="bigbtn" data-go="clock"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><strong>Pointage</strong><span>Entrée et sortie du personnel</span></button>
    </div>
    <div class="h2s"><h2>Dernières saisies</h2><span class="muted">${recent.length} élément(s)</span></div>
    <div class="recent">${recent.length?recent.map(r=>`<div class="r"><span>${esc(lbl(r))}<small>${esc(sub(r))}</small></span><span class="tag ${r.pending?"warn":"ok"}">${r.pending?"local":"envoyé"}</span></div>`).join(""):`<div class="r"><span class="muted">Aucune saisie pour le moment.</span></div>`}</div>
    <p class="muted">Gros boutons, peu de texte : utilisable avec des gants sur un téléphone durci.</p>`;
  } else if(screen==="incident"){
    inner=`<form class="form" id="f-inc"><h2>Déclarer un incident</h2>
      <label class="field">Type <select id="i-type">${TYPES.map(t=>`<option>${t}</option>`).join("")}</select></label>
      <div class="field">Gravité <small>1 = mineur · 4 = critique</small><div class="sev">${[1,2,3,4].map(n=>`<label><input type="radio" name="sev" value="${n}" ${n===2?"checked":""}><span>${n}</span></label>`).join("")}</div></div>
      <label class="field">Lieu <input id="i-place" value="Zone de chargement B" required></label>
      <label class="field">Ce qui s'est passé <textarea id="i-desc" required placeholder="En deux phrases. Qui, quoi, où."></textarea></label>
      <label class="field">Photo <small>compressée automatiquement avant envoi</small><input type="file" id="i-photo" accept="image/*" capture="environment"></label>
      <div id="i-prev"></div>
      <label class="field">Déclaré par <select id="i-by">${STAFF.map(s=>`<option>${s}</option>`).join("")}</select></label>
      <div style="display:flex;gap:.6rem;flex-wrap:wrap"><button type="button" class="btn ghost" data-go="home">Annuler</button><button type="submit" class="btn primary">Enregistrer l'incident</button></div></form>`;
  } else if(screen==="inspect"){
    inner=`<form class="form" id="f-ins"><h2>Inspection avant démarrage</h2>
      <label class="field">Équipement <select id="n-eq">${EQUIP.map(e=>`<option value="${e.id}">${e.name}</option>`).join("")}</select></label>
      <div class="checklist">${CHECK.map((c,i)=>`<div class="checkrow"><span>${c}</span><span class="okko"><label><input type="radio" name="c${i}" value="ok" checked>OK</label><label><input type="radio" name="c${i}" value="ko">KO</label></span></div>`).join("")}</div>
      <label class="field">Remarques <textarea id="n-rem" placeholder="Facultatif"></textarea></label>
      <label class="field">Inspecté par <select id="n-by">${STAFF.map(s=>`<option>${s}</option>`).join("")}</select></label>
      <div style="display:flex;gap:.6rem;flex-wrap:wrap"><button type="button" class="btn ghost" data-go="home">Annuler</button><button type="submit" class="btn primary">Enregistrer l'inspection</button></div></form>`;
  } else if(screen==="clock"){
    const t=today();
    inner=`<div class="form"><h2>Pointage du jour</h2>
      ${STAFF.map(s=>{const c=state.clock.find(x=>x.name===s&&x.date===t);return `<div class="checkrow"><span>${s}<br><span class="muted">${c?("Entrée "+c.in+(c.out?" · Sortie "+c.out:"")):"Pas encore pointé"}</span></span>${!c?`<button type="button" class="btn primary small" data-in="${esc(s)}">Entrée</button>`:!c.out?`<button type="button" class="btn ghost small" data-out="${esc(s)}">Sortie</button>`:'<span class="tag ok">journée close</span>'}</div>`;}).join("")}
      <div><button type="button" class="btn ghost" data-go="home">Retour</button></div></div>`;
  }
  $("view").innerHTML=`${netBanner()}<div class="phone">${inner}</div>`;
  bindSync();
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{screen=b.dataset.go;photo=null;renderField();});
  const fi=$("f-inc"); if(fi){
    $("i-photo").onchange=()=>{const f=$("i-photo").files[0];if(!f)return;const r=new FileReader();r.onload=()=>{photo=r.result;$("i-prev").innerHTML=`<img class="thumb" src="${photo}" alt="Aperçu de la photo"> <span class="muted">Photo jointe</span>`;};r.readAsDataURL(f);};
    fi.onsubmit=e=>{e.preventDefault();const d={id:mkRef("INC"),date:today(),time:now(),type:$("i-type").value,sev:parseInt(fi.querySelector("input[name=sev]:checked").value,10),place:$("i-place").value.trim(),desc:$("i-desc").value.trim(),by:$("i-by").value,status:"ouvert",photo:!!photo};push({kind:"incident",data:d});screen="home";renderField();};
  }
  const fn=$("f-ins"); if(fn){ fn.onsubmit=e=>{e.preventDefault();let ok=0,ko=0;CHECK.forEach((c,i)=>{fn.querySelector(`input[name=c${i}]:checked`).value==="ok"?ok++:ko++;});push({kind:"inspection",data:{equip:$("n-eq").value,date:today(),ok,ko,by:$("n-by").value,rem:$("n-rem").value.trim()}});screen="home";renderField();}; }
  document.querySelectorAll("[data-in]").forEach(b=>b.onclick=()=>{push({kind:"clock",data:{name:b.dataset.in,date:today(),in:now(),out:null}});renderField();});
  document.querySelectorAll("[data-out]").forEach(b=>b.onclick=()=>{const c=state.clock.find(x=>x.name===b.dataset.out&&x.date===today());if(c){c.out=now();save();}renderField();});
}

function lastInsp(eq){return state.inspections.filter(i=>i.equip===eq).sort((a,b)=>b.date<a.date?-1:1)[0];}
function renderMgr(){
  const open=state.incidents.filter(i=>i.status==="ouvert");
  const late=EQUIP.filter(e=>{const l=lastInsp(e.id);return !l||daysUntil(l.date)<-7;});
  const expiring=state.docs.filter(d=>daysUntil(d.exp)<=30);
  $("view").innerHTML=`${netBanner()}
    <div class="section-head"><div><h1>Tableau de bord du responsable</h1><p class="muted">Ce que le donneur d'ordre demandera à la prochaine réunion HSE, déjà prêt. Les lignes « exemple » sont des données de démonstration.</p></div>
    <div style="display:flex;gap:.6rem;flex-wrap:wrap"><button type="button" class="btn primary small" id="pdf">Exporter le rapport (PDF)</button><button type="button" class="btn ghost small" id="reset">Réinitialiser la démo</button></div></div>
    <div class="mgr-hero"><img src="../assets/mining/repair.jpg" alt="Camion de mine en maintenance dans un atelier" loading="lazy"><span>Atelier de maintenance · chaque équipement est inspecté avant le démarrage du poste</span></div>
    <div class="kpis">
      <div class="kpi ${open.length?"bad":""}"><span class="l">Incidents ouverts</span><span class="v">${open.length}</span></div>
      <div class="kpi ${late.length?"warn":""}"><span class="l">Inspections en retard (> 7 j)</span><span class="v">${late.length}</span></div>
      <div class="kpi ${expiring.length?"bad":""}"><span class="l">Documents à renouveler (≤ 30 j)</span><span class="v">${expiring.length}</span></div>
      <div class="kpi"><span class="l">Présents aujourd'hui</span><span class="v">${state.clock.filter(c=>c.date===today()&&!c.out).length}</span></div>
    </div>
    <section><h2>Incidents</h2><div class="tablewrap" style="margin-top:.6rem"><table><thead><tr><th>N°</th><th>Date</th><th>Type</th><th>Gravité</th><th>Lieu</th><th>Description</th><th>Par</th><th>Statut</th><th></th></tr></thead><tbody>
    ${state.incidents.map(i=>`<tr><td class="num">${esc(i.id)}${i.sample?' <span class="tag info">exemple</span>':""}</td><td class="num">${fmtDate(i.date)} ${esc(i.time)}</td><td>${esc(i.type)}</td><td><span class="tag ${i.sev>=3?"bad":i.sev===2?"warn":"ok"}">${i.sev}/4</span></td><td>${esc(i.place)}</td><td>${esc(i.desc)}${i.photo?' <span class="tag info">photo</span>':""}</td><td>${esc(i.by)}</td><td><span class="tag ${i.status==="ouvert"?"bad":"ok"}">${esc(i.status)}</span></td><td>${i.status==="ouvert"?`<button type="button" class="btn ghost small" data-close="${i.id}">Clôturer</button>`:""}</td></tr>`).join("")}
    </tbody></table></div></section>
    <section><h2>Équipements</h2><div class="tablewrap" style="margin-top:.6rem"><table><thead><tr><th>Équipement</th><th>Dernière inspection</th><th>Résultat</th><th>Par</th><th>État</th></tr></thead><tbody>
    ${EQUIP.map(e=>{const l=lastInsp(e.id);const d=l?daysUntil(l.date):null;return `<tr><td>${esc(e.name)}</td><td class="num">${l?fmtDate(l.date):"—"}</td><td>${l?(l.ko?`<span class="tag bad">${l.ko} point(s) KO</span>`:'<span class="tag ok">6/6 OK</span>'):"—"}</td><td>${l?esc(l.by):"—"}</td><td>${!l?'<span class="tag bad">jamais inspecté</span>':d<-7?'<span class="tag warn">en retard</span>':'<span class="tag ok">à jour</span>'}</td></tr>`;}).join("")}
    </tbody></table></div></section>
    <section><h2>Dossier de conformité · contrat Kolwezi</h2><div class="tablewrap" style="margin-top:.6rem"><table><thead><tr><th>Document</th><th>Référence</th><th>Expire le</th><th>Reste</th><th>État</th></tr></thead><tbody>
    ${state.docs.map(d=>{const n=daysUntil(d.exp);return `<tr><td>${esc(d.name)}</td><td class="num">${esc(d.ref)}</td><td class="num">${fmtDate(d.exp)}</td><td class="num">${n<0?"expiré depuis "+(-n)+" j":n+" j"}</td><td>${n<0?'<span class="tag bad">expiré</span>':n<=30?'<span class="tag warn">à renouveler</span>':'<span class="tag ok">valide</span>'}</td></tr>`;}).join("")}
    </tbody></table></div></section>
    <p class="credits">Application de démonstration réalisée par <a href="../../index.html">IK Digital Solutions</a>. Photos via Wikimedia Commons : chargement d'un camion par <a href="https://commons.wikimedia.org/wiki/File:Belaz_haul_truck_and_a_Hitachi_mining_excavator.jpg" rel="noopener">Sandrerro</a> (CC BY-SA 3.0) ; atelier par <a href="https://commons.wikimedia.org/wiki/File:Haul_truck_under_repair_at_Brockman_4,_September_2018.jpg" rel="noopener">Calistemon</a> (CC BY-SA 4.0).</p>`;
  bindSync();
  document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>{state.incidents.find(i=>i.id===b.dataset.close).status="clôturé";save();renderMgr();});
  $("reset").onclick=()=>{state=seed();save();renderMgr();toast("Données de démonstration réinitialisées");};
  $("pdf").onclick=()=>{
    $("report").innerHTML=`<h1>Sotramines Services SARL · Rapport HSE et conformité</h1><p>Contrat Kolwezi · généré le ${fmtDate(today())} · document de démonstration, données fictives</p>
      <h2>Incidents (${state.incidents.length})</h2><table><tr><th>N°</th><th>Date</th><th>Type</th><th>Gravité</th><th>Lieu</th><th>Statut</th></tr>${state.incidents.map(i=>`<tr><td>${esc(i.id)}</td><td>${fmtDate(i.date)}</td><td>${esc(i.type)}</td><td>${i.sev}/4</td><td>${esc(i.place)}</td><td>${esc(i.status)}</td></tr>`).join("")}</table>
      <h2>Équipements</h2><table><tr><th>Équipement</th><th>Dernière inspection</th><th>Résultat</th></tr>${EQUIP.map(e=>{const l=lastInsp(e.id);return `<tr><td>${esc(e.name)}</td><td>${l?fmtDate(l.date):"—"}</td><td>${l?(l.ko?l.ko+" KO":"6/6 OK"):"—"}</td></tr>`;}).join("")}</table>
      <h2>Documents</h2><table><tr><th>Document</th><th>Référence</th><th>Expire le</th></tr>${state.docs.map(d=>`<tr><td>${esc(d.name)}</td><td>${esc(d.ref)}</td><td>${fmtDate(d.exp)}</td></tr>`).join("")}</table>`;
    window.print();
  };
}

function render(){
  document.querySelectorAll("[data-view]").forEach(b=>b.setAttribute("aria-selected",b.dataset.view===view?"true":"false"));
  view==="field"?renderField():renderMgr();
}
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{view=b.dataset.view;render();});
$("net").onclick=()=>{online=!online;$("net").classList.toggle("on",online);$("net").setAttribute("aria-pressed",online?"true":"false");$("net").querySelector("span").textContent=online?"Réseau sur site : en ligne":"Réseau sur site : hors ligne";render();};
render();
})();
</script>
</body>
</html>
