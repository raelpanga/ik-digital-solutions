<style>
:root{--bg:#F5F5F2;--surface:#FFFFFF;--surface-2:#ECECE7;--ink:#141A26;--ink-2:#4A5163;--ink-3:#7C8394;--line:#DCDDD8;--navy:#141A26;--accent:#141A26;--accent-soft:#E6E8EE;--on-accent:#FFFFFF;--gold:#B08D57;--gold-soft:#F3EBDD;--ok:#1E7F48;--ok-soft:#DDF3E5;--warn:#8F6210;--warn-soft:#F8EDD3;--bad:#B3261E;--bad-soft:#F9E0DE;--copper:#A84E27;--copper-soft:#F7E7DE;--radius:6px;--font:"Instrument Sans","Segoe UI",Arial,sans-serif;--display:"Cormorant Garamond",Georgia,serif;--mono:"IBM Plex Mono",Consolas,monospace;color-scheme:light}

:root[data-theme="dark"]{--bg:#0F131B;--surface:#171C26;--surface-2:#1F2531;--ink:#E9EAEE;--ink-2:#AEB3C0;--ink-3:#7C8394;--line:#2B3140;--navy:#0B0E14;--accent:#D6C3A0;--accent-soft:#2A2F3D;--on-accent:#0F131B;--gold:#CFAE78;--gold-soft:#3A3121;--ok:#4FCB84;--ok-soft:#163326;--warn:#E3B75C;--warn-soft:#3A2E12;--bad:#F08A80;--bad-soft:#3B1A17;--copper:#E08B5D;--copper-soft:#3A241A;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;padding-inline:clamp(16px,3vw,32px);padding-block:0 40px}

.login .box{background:#fff;color:#141A26;width:100%;max-width:440px;padding:2rem 2.2rem;display:grid;gap:1rem;box-shadow:0 30px 60px rgba(0,0,0,.4)}

input[type=number]{font-family:var(--mono)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font:inherit;font-weight:600;font-size:.86rem;padding:.5rem .85rem;border-radius:4px;border:1px solid transparent;cursor:pointer;text-decoration:none;line-height:1.2;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--on-accent)}.btn.gold{background:var(--gold);color:#fff}.btn.ghost{background:transparent;border-color:var(--ink-3);color:var(--ink)}.btn.small{padding:.32rem .55rem;font-size:.78rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem}

.filters{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}

.section-head{display:flex;justify-content:space-between;align-items:end;gap:1rem;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1rem 1.1rem;display:grid;gap:.7rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1rem}@media (max-width:960px){.two{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:.25rem}.chip{font-family:var(--mono);font-size:.68rem;padding:.12rem .4rem;border-radius:3px;background:var(--surface-2);color:var(--ink-2)}

.notes{display:grid;gap:.4rem}.note{padding:.55rem .7rem;border-left:3px solid var(--gold);background:var(--surface-2);border-radius:0 4px 4px 0;font-size:.88rem}.note small{display:block;color:var(--ink-3)}
.form{display:grid;gap:.8rem}.frow{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}@media (max-width:640px){.frow{grid-template-columns:1fr}}

.dlg-head{padding:.9rem 1.2rem;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:.8rem;flex-wrap:wrap}

<div class="ikbar"><span><strong>Démonstrateur IK Digital Solutions</strong> · reproduction de l'outil de production de Mac &amp; Clay avec des données fictives · Shopify, SMS et e-mails simulés · l'outil réel est en anglais</span><a href="../../projets/macclay-wedding-tracker.html">← Retour au portfolio</a></div>

<script>
(function(){
"use strict";
const KEY="ik-demo-macclay-v1";
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=id=>document.getElementById(id);
const usd=n=>n.toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" USD";
const today=()=>new Date().toISOString().slice(0,10);
const nowT=()=>new Date().toTimeString().slice(0,5);
const addDays=(d,n)=>{const x=new Date(d+"T00:00:00");x.setDate(x.getDate()+n);return x.toISOString().slice(0,10);};
const daysUntil=d=>Math.round((new Date(d+"T00:00:00")-new Date(today()+"T00:00:00"))/86400000);
const fmtDate=d=>new Date(d+"T00:00:00").toLocaleDateString("fr-FR",{day:"2-digit",month:"short",year:"numeric"});
const mkId=p=>p+"-"+Math.random().toString(36).slice(2,7).toUpperCase();
const ROLES=[["Propriétaire","Matt G.","tout voir, administration"],["Coordinatrice","Ava Thompson","tous les mariages, tous les magasins"],["Responsable de magasin","Noah Kim","mariages de son magasin"],["Personnel","Mia Lopez","mesures, pointages, notes"]];
const STORES=["Cadentown","Southland Drive","Mercer Road"];
const STYLISTS=["Ava Thompson","Noah Kim","Mia Lopez"];
const MROLES=["Marié","Témoin","Garçon d'honneur","Père du marié","Père de la mariée","Porteur d'alliances"];
const WAIVER=10;
const CHECKS=[[-60,"Confirmer les membres du cortège"],[-30,"Toutes les mesures prises"],[-14,"Commandes converties dans Shopify"],[-7,"Retraits planifiés et paiements relancés"],[1,"Retours vérifiés, frais de retard appliqués"]];

function seed(){
  const t=today();
  const catalog=[{id:"c1",name:"Veste",price:110},{id:"c2",name:"Pantalon",price:35},{id:"c3",name:"Chemise",price:25},{id:"c4",name:"Gilet",price:30},{id:"c5",name:"Cravate / nœud",price:12},{id:"c6",name:"Chaussures",price:28},{id:"c7",name:"Boutons de manchette",price:8}];
  const full=["c1","c2","c3","c4","c5","c6"];
  const mk=(id,couple,dd,store,stylist,members,extra)=>{const w={id,couple,date:addDays(t,dd),store,stylist,status:"active",members:members.map((m,i)=>({id:id+"-m"+(i+1),name:m[0],role:m[1],phone:"+1 859 555 0"+(200+i+Math.abs(dd)%50),items:m[2]||full,measured:!!m[3],meas:m[3]||null,shopify:{draft:"MC-D-"+(1000+Math.floor(Math.random()*900)),state:"brouillon",payLinkSent:false,lateFee:0,discount:0}})),checkins:CHECKS.map(([off,label])=>({key:off,label,due:addDays(addDays(t,dd),off),done:false})),notes:[],activity:[]};Object.assign(w,extra||{});return w;};
  const M={chest:"40",waist:"34",sleeve:"34",neck:"16",inseam:"32",outseam:"42",shoe:"11",height:"180"};
  const W=[
    mk("W1","Emma & Lucas Martin",5,"Cadentown","Ava Thompson",[["Lucas Martin","Marié",full,M],["Owen Brooks","Témoin",full,M],["Liam Carter","Garçon d'honneur",full,M],["Noah Bennett","Garçon d'honneur",full,null]]),
    mk("W2","Sofia & Daniel Reyes",24,"Southland Drive","Noah Kim",[["Daniel Reyes","Marié",full,M],["Mateo Reyes","Témoin",full,null],["Elijah Price","Garçon d'honneur",["c1","c2","c3","c5"],null],["Henry Walsh","Garçon d'honneur",full,null],["Jack Morgan","Garçon d'honneur",full,null]]),
    mk("W3","Grace & Ethan Cole",41,"Mercer Road","Mia Lopez",[["Ethan Cole","Marié",full,M],["Caleb Ross","Témoin",full,null],["Aiden Ford","Garçon d'honneur",full,null]]),
    mk("W4","Chloe & Ryan Foster",67,"Cadentown","Ava Thompson",[["Ryan Foster","Marié",full,null],["Sam Foster","Témoin",full,null]]),
    mk("W5","Olivia & Mason Hill",-12,"Cadentown","Ava Thompson",[["Mason Hill","Marié",full,M],["Levi Hart","Témoin",full,M],["Wyatt Lane","Garçon d'honneur",full,M]],{status:"completed"})
  ];
  W[0].checkins[0].done=true;W[0].checkins[1].done=true;W[0].members[0].shopify.state="payé";W[0].members[1].shopify.state="payé";W[0].members[2].shopify.state="commande";W[0].members[2].shopify.payLinkSent=true;
  W[1].checkins[0].done=true;
  W[4].checkins.forEach(c=>c.done=true);W[4].members.forEach(m=>m.shopify.state="payé");W[4].members[2].shopify.lateFee=25;
  W[0].notes.push({date:addDays(t,-3)+" 14:20",by:"Ava Thompson",text:"Noah Bennett vit à Louisville, il passera se faire mesurer samedi."});
  W[0].activity.push({date:addDays(t,-3)+" 14:20",by:"Ava Thompson",text:"Note ajoutée"},{date:addDays(t,-9)+" 10:05",by:"Système",text:"Brouillons Shopify créés pour 4 membres"});
  const users=ROLES.map(([r,n])=>({name:n,role:r,store:r==="Responsable de magasin"?"Southland Drive":"Tous"}));
  return {user:{name:"Ava Thompson",role:"Coordinatrice"},catalog,weddings:W,users,sync:{lastRun:addDays(t,0)+" "+nowT(),runs:184,errors:0},emails:[],sms:[]};
}
function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s);}catch(e){}return seed();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
let state=load(), page="dash", sel=null, filt={store:"",stylist:""}, query="";
const Wd=id=>state.weddings.find(w=>w.id===id);
const cat=id=>state.catalog.find(c=>c.id===id);
const total=m=>Math.round((m.items.reduce((s,i)=>s+(cat(i)?cat(i).price:0),0)+WAIVER-(m.shopify.discount||0)+(m.shopify.lateFee||0))*100)/100;
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),3000);}
function log(w,text){w.activity.unshift({date:today()+" "+nowT(),by:state.user?state.user.name:"Système",text});}
function email(to,subject){state.emails.unshift({date:today()+" "+nowT(),to,subject});}
function sms(to,text){state.sms.unshift({date:today()+" "+nowT(),to,text});}
function syncPass(){let n=0;state.weddings.forEach(w=>{if(w.status!=="active")return;w.members.forEach(m=>{if(m.shopify.state==="brouillon"&&daysUntil(w.date)<=7){m.shopify.state="commande";n++;log(w,`Brouillon ${m.shopify.draft} converti en commande Shopify (${m.name})`);}});});state.sync.lastRun=today()+" "+nowT();state.sync.runs++;save();return n;}
function closeModal(){$("modal").innerHTML="";}
const canAdmin=()=>state.user&&(state.user.role==="Propriétaire"||state.user.role==="Coordinatrice");
const visible=w=>!(state.user&&state.user.role==="Responsable de magasin"&&w.store!=="Southland Drive");

/* ---------- login ---------- */
function renderLogin(){
  $("app").innerHTML=`<div class="login"><form class="box" id="lf"><div class="wordmark">Mac &amp; Clay<small>Wedding Tracker</small></div>
    <p class="muted" style="text-align:center">Choisissez un rôle pour entrer. En production, chaque membre du personnel a son propre compte.</p>
    <div class="roles">${ROLES.map(([r,n,d],i)=>`<label><input type="radio" name="role" value="${i}" ${i===1?"checked":""}><b>${r}</b><span>${d}</span></label>`).join("")}</div>
    <label class="field">E-mail<input value="ava@macandclay.com" readonly></label>
    <label class="field">Mot de passe<input type="password" value="demo-demo" readonly></label>
    <button class="btn primary" type="submit">Se connecter</button>
    <p class="muted" style="text-align:center">Mot de passe oublié ? · <a href="#" id="reset0">Réinitialiser la démo</a></p></form></div>`;
  $("lf").onsubmit=e=>{e.preventDefault();const i=+document.querySelector("input[name=role]:checked").value;state.user={name:ROLES[i][1],role:ROLES[i][0]};save();page="dash";render();toast("Connecté en tant que "+state.user.role+".");};
  $("reset0").onclick=e=>{e.preventDefault();state=seed();save();render();};
}

/* ---------- pieces ---------- */
function dueCheckins(){return state.weddings.filter(w=>w.status==="active"&&visible(w)).flatMap(w=>w.checkins.filter(c=>!c.done&&c.due<=today()).map(c=>({w,c})));}
function nextCheckin(w){const c=w.checkins.find(x=>!x.done);return c?c:null;}
function dday(w){const n=daysUntil(w.date);if(w.status==="completed")return '<span class="tag info">terminé</span>';if(n===0)return '<span class="tag bad">aujourd\'hui</span>';if(n<0)return '<span class="tag warn">retours</span>';return `<span class="tag ${n<=7?"bad":n<=30?"warn":"gold"}">J-${n}</span>`;}

function renderDash(){
  const act=state.weddings.filter(w=>w.status==="active"&&visible(w));
  let list=act.filter(w=>(!filt.store||w.store===filt.store)&&(!filt.stylist||w.stylist===filt.stylist)).sort((a,b)=>a.date<b.date?-1:1);
  const next30=act.filter(w=>daysUntil(w.date)>=0&&daysUntil(w.date)<=30).length;
  const due=dueCheckins().length;
  const review=act.filter(w=>daysUntil(w.date)<=30).reduce((s,w)=>s+w.members.filter(m=>!m.measured).length,0);
  const out=act.filter(w=>daysUntil(w.date)>=-4&&daysUntil(w.date)<=3).reduce((s,w)=>s+w.members.filter(m=>m.shopify.state!=="brouillon").length,0);
  const parties=act.reduce((s,w)=>s+w.members.length,0);
  return `<div class="section-head"><div><h1>Tableau de bord</h1><p class="muted">Bonjour ${esc(state.user.name)} · ${fmtDate(today())}</p></div><button type="button" class="btn gold" id="go-new">+ Nouveau mariage</button></div>

function render(){
  if(!state.user){renderLogin();return;}
  const due=dueCheckins().length;
  const nav=[["dash","Tableau de bord"],["new","Nouveau mariage"],["checkins","Pointages",due],["done","Terminés"],["search","Recherche"]];
  const adm=[["users","Utilisateurs"],["catalog","Catalogue"],["sync","Synchro Shopify"]];
  const cur=page==="wedding"?"dash":page;
  let content="";
  if(page==="wedding"&&sel&&Wd(sel))content=renderWedding(Wd(sel));
  else{content=({dash:renderDash,new:renderNew,checkins:renderCheckins,done:renderDone,search:renderSearch,users:renderUsers,catalog:renderCatalog,sync:renderSync})[page]();}
  $("app").innerHTML=`<div class="shell"><aside class="side"><div class="wordmark">Mac &amp; Clay<small>Wedding Tracker</small></div><div class="lbl">Navigation</div>${nav.map(([k,l,n])=>`<button type="button" data-nav="${k}" aria-current="${cur===k}"><span>${l}</span>${n?`<span class="badge">${n}</span>`:""}</button>`).join("")}${canAdmin()?`<div class="lbl">Admin</div>${adm.map(([k,l])=>`<button type="button" data-nav="${k}" aria-current="${cur===k}"><span>${l}</span></button>`).join("")}`:""}<div class="me"><b>${esc(state.user.name)}</b>${esc(state.user.role)}<br><a href="#" id="logout">Se déconnecter</a> · <a href="#" id="reset">Réinitialiser</a></div></aside><main>${content}</main></div>`;
  document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{page=b.dataset.nav;sel=null;render();});
  $("logout").onclick=e=>{e.preventDefault();state.user=null;save();render();};
  $("reset").onclick=e=>{e.preventDefault();const u=state.user;state=seed();state.user=u;save();page="dash";sel=null;render();toast("Données de démonstration réinitialisées");};
  if(page==="dash")bindDash();else if(page==="new")bindNew();else if(page==="wedding"&&sel)bindWedding(Wd(sel));else if(page==="checkins"||page==="done")bindOpen();
  else if(page==="search"){$("q").oninput=()=>{query=$("q").value;render();$("q").focus();$("q").setSelectionRange(query.length,query.length);};bindOpen();}
  else if(page==="users"){document.querySelectorAll("[data-delu]").forEach(b=>b.onclick=()=>{state.users.splice(b.dataset.delu,1);save();render();});$("uf").onsubmit=e=>{e.preventDefault();state.users.push({name:$("u-name").value.trim(),role:$("u-role").value,store:$("u-store").value});save();render();toast("Invitation envoyée (simulé).");};}
  else if(page==="catalog"){document.querySelectorAll("[data-price]").forEach(i=>i.onchange=()=>{cat(i.dataset.price).price=Math.max(0,parseFloat(i.value)||0);save();toast("Prix mis à jour : les brouillons Shopify seront reconstruits.");});}
  else if(page==="sync"){$("run").onclick=()=>{const n=syncPass();render();toast(n?n+" brouillon(s) converti(s) en commande (mariage à 7 jours ou moins).":"Synchronisation terminée, rien à convertir.");};}
}
syncPass();
render();
})();
</script>
</body></html>
